<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Rundown</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rundown">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23c8102e%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3EA%26K%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3fbfa; --ink:#2b1a1e; --muted:#7a6a6e; --faint:#b3a5a9;
  --line:#f1dfe5; --accent:#c8102e; --accent-2:#0abab5; --accent-ink:#fff; --accent-soft:#fde8ee;
  --gold:#0e958f; --alert:#c8102e; --alert-soft:#fde8ea; --music:#0e8a84; --music-soft:#e2f6f4;
  --note:#a3485f; --note-soft:#fdeff3; --ok:#0abab5; --tiffany:#81d8d0; --pink:#f6b8c8; --red:#c8102e;
  --shadow:0 1px 2px rgba(120,20,40,.05),0 6px 18px rgba(120,20,40,.07);
  --r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans HK","Microsoft JhengHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Cormorant Garamond","Noto Serif HK","Songti TC",Georgia,serif;
  --tint-mix:38%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#170f12; --surface:#221719; --surface-2:#2b1e22; --ink:#f8eef0; --muted:#bba9ae; --faint:#86747a;
    --line:#3b2a30; --accent:#ff5c72; --accent-2:#4fd1ca; --accent-ink:#1a0d10; --accent-soft:#3a1d26;
    --gold:#4fd1ca; --alert:#ff6b7a; --alert-soft:#3d1a20; --music:#6fdcd5; --music-soft:#15302e;
    --note:#f4a9be; --note-soft:#3a2029; --ok:#4fd1ca; --tiffany:#4fb8b1; --pink:#e58aa5; --red:#ff5c72;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --tint-mix:14%; --hl-mix:9%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170f12; --surface:#221719; --surface-2:#2b1e22; --ink:#f8eef0; --muted:#bba9ae; --faint:#86747a;
  --line:#3b2a30; --accent:#ff5c72; --accent-2:#4fd1ca; --accent-ink:#1a0d10; --accent-soft:#3a1d26;
  --gold:#4fd1ca; --alert:#ff6b7a; --alert-soft:#3d1a20; --music:#6fdcd5; --music-soft:#15302e;
  --note:#f4a9be; --note-soft:#3a2029; --ok:#4fd1ca; --tiffany:#4fb8b1; --pink:#e58aa5; --red:#ff5c72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tint-mix:14%; --hl-mix:9%; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
a{color:inherit}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:600 19px/1.1 var(--serif);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.off i{background:var(--faint);box-shadow:none}
.pill.sync i{background:var(--gold);box-shadow:none;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.icon{padding:7px 9px;color:var(--accent)}
.btn.icon svg{width:18px;height:18px}
.lang-sw{display:inline-flex;flex:none;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.lang-sw button{border:0;background:none;color:var(--muted);font:600 12px/1 var(--sans);padding:7px 9px;border-radius:999px;cursor:pointer;white-space:nowrap}
.lang-sw button.on{background:var(--accent);color:var(--accent-ink)}
.lang-sw.busy button.on{animation:pulse 1s ease-in-out infinite}
@media (max-width:460px){.top-in{gap:6px;padding:10px 12px}.lang-sw button{padding:7px 7px;font-size:11.5px}.pill{font-size:10.5px;gap:5px}.brand b{font-size:17px}}
@media (max-width:380px){.pill span{display:none}}
@media (max-width:460px){.brand{flex:1 1 auto}.brand b{font-size:0;line-height:1}.brand b:before{content:"囍";font:700 24px/1 "Noto Serif HK","Songti TC","PingFang HK",serif;color:var(--red)}}
@media (max-width:400px){.top-in{gap:7px}.pill{font-size:10.5px}.btn{padding:7px 11px}.brand small{display:none}}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn:disabled{opacity:.5}

.editbar{display:none;max-width:760px;margin:0 auto;padding:8px 16px 10px;font-size:13px;color:var(--accent);gap:8px;align-items:center;flex-wrap:wrap}
body.editing .editbar{display:flex}
.editbar a{font-weight:600}

main{max-width:760px;margin:0 auto;padding:14px 16px 24px}

/* ── hero ── */
.hero{position:relative;border-radius:20px;padding:22px 20px 18px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 32%,var(--surface)) 0%,var(--surface) 50%,color-mix(in srgb,var(--tiffany) 30%,var(--surface)) 100%);
  border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--red)}
.hero:after{content:"囍";position:absolute;right:16px;top:12px;font:700 84px/1 "Noto Serif HK","Songti TC","PingFang HK",serif;color:var(--red);opacity:.12;pointer-events:none}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font:600 34px/1.05 var(--serif);margin:6px 0 4px;color:var(--accent)}
.hero .ver{display:inline-block;font-size:12px;font-weight:700;margin-top:4px}
.hero .meta{margin-top:12px;display:grid;gap:4px;font-size:14px}
.hero .meta div{display:flex;gap:8px}
.hero .meta span{color:var(--muted);min-width:64px}
.count{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.count b{font:700 40px/1 var(--serif);color:var(--accent)}
.count span{color:var(--muted);font-size:14px}

/* now card */
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.nowcard h4{margin:0 0 2px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.nowcard .row{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.nowcard h4+.row{border-top:0}
.nowcard .tm{font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}
.nowcard .nx{color:var(--muted)}
.nowcard .act{display:flex;gap:8px;margin-top:10px}

/* gantt */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.card-h h3{margin:0;font:600 18px/1.2 var(--serif)}
.card-h small{color:var(--muted);font-size:12px}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 0 12px}
.gantt{position:relative;margin:0 16px}
.gt{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.gt span{position:absolute;top:0;left:4px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gb{position:absolute;height:24px;border-radius:7px;border:1px solid color-mix(in srgb,var(--tint,var(--accent)) 55%,var(--line));
  background:color-mix(in srgb,var(--tint,var(--accent-soft)) 70%,var(--surface));padding:0 6px;font-size:11px;line-height:22px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;color:var(--ink)}
:root[data-theme="dark"] .gb{color:#1d1622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb.tinted{color:#1d1622}}
.gb.plain{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.gb.now{outline:2px solid var(--accent);outline-offset:1px}
.gnow{position:absolute;top:14px;bottom:0;width:2px;background:var(--alert);border-radius:2px}
.gnow:before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--alert)}

/* search + jump */
.tools{display:flex;gap:8px;margin:0 0 10px;position:sticky;top:57px;z-index:20;padding:8px 0;background:var(--bg)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%;padding:10px 0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* sections + timeline */
.sec{margin-top:8px}
.sec-h{position:sticky;top:115px;z-index:10;margin:14px -16px 8px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:700 20px/1.2 var(--serif);color:var(--accent);display:flex;align-items:center;gap:10px}
.sec-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec-h.hl{background:color-mix(in srgb,var(--tiffany) var(--hl-mix,24%),var(--bg))}
.tl{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:62px 18px 1fr;gap:0 6px;position:relative;scroll-margin-top:170px}
.blk.untimed{grid-template-columns:0 18px 1fr}
.blk .t{padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.blk .t b{display:block;font-size:16px;font-weight:700}
.blk .t em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.rail{position:relative}
.rail:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.blk:first-child .rail:before{top:16px}
.blk:last-child .rail:before{bottom:calc(100% - 20px)}
.dot{position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-2)}
.cards{padding:6px 0 8px;min-width:0}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 14px 12px;margin-bottom:8px;
  border-left:5px solid var(--tint,var(--line));position:relative}
.ent.tinted{background:color-mix(in srgb,var(--tint) var(--tint-mix),var(--surface))}
.who{margin:0 0 3px;font-size:15.5px;font-weight:700;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.desc{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.sub{border-top:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);margin-top:9px;padding-top:9px}
.rem{margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--note-soft);color:var(--note);font-size:13.5px;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px}
.rem svg{flex:none;width:15px;height:15px;margin-top:2px}
.rem.music{background:var(--music-soft);color:var(--music)}
.rem.alert{background:var(--alert-soft);color:var(--alert);font-weight:700}
.badge{position:absolute;top:-9px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:999px}
.blk.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.blk.now .ent{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));border-left-color:var(--tint,var(--accent))}
.blk.now .ent:first-child .badge{background:var(--accent);color:var(--accent-ink)}
.blk.next .ent:first-child .badge{background:var(--gold);color:#fff}
.blk.past{opacity:.55}
.blk.past .dot{background:var(--line);border-color:var(--faint)}
.blk.flash .ent{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:var(--shadow)}}
mark{background:color-mix(in srgb,#ffd84d 70%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.red{color:var(--alert);font-weight:700}

/* phone links */
.tel{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
.wa{display:inline-flex;vertical-align:-3px;margin:0 3px 0 4px;width:19px;height:19px;border-radius:50%;background:#25d366;color:#fff;align-items:center;justify-content:center}
.wa svg{width:12px;height:12px}

/* info tab */
.info-title{font:600 30px/1.1 var(--serif);color:var(--accent);margin:4px 0 2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted);font-size:13px;padding-top:1px}
.kv .v{white-space:pre-wrap;word-break:break-word;font-weight:600}
.grp{padding:12px 16px 4px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;border-top:1px solid var(--line)}
.callrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
.callbtn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;
  background:var(--accent-soft);color:var(--accent)}
.callbtn svg{width:14px;height:14px}
.callbtn.w{background:color-mix(in srgb,#25d366 16%,var(--surface));color:color-mix(in srgb,#128c4b 85%,var(--ink))}

/* seating tab */
.st-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.st-top small{color:var(--muted);font-size:12.5px}
.st-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.st-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px 6px}
.st-h h3{margin:0;font:600 20px/1.2 var(--serif);color:var(--accent)}
.st-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.st-svg{display:block;width:100%;max-width:360px;margin:0 auto;height:auto}
.st-svg .tbl{fill:var(--tt,var(--accent-soft));stroke:var(--gold);stroke-width:1.5}
.st-svg .tname{fill:var(--ink);font:600 15px var(--serif)}
.st-svg .tcount{fill:var(--muted);font:500 10.5px var(--sans)}
.st-svg .seat{fill:var(--surface);stroke:var(--tt-line,var(--accent-2));stroke-width:1.5}
.st-svg .sname{fill:var(--ink);font-family:var(--sans);font-weight:600}
.st-svg .snum{fill:var(--muted);font:600 8.5px var(--sans)}
.st-svg g.hit .seat{fill:var(--gold);stroke:var(--gold)}
.st-svg g.hit .sname{fill:#fff}
.st-svg g.dim{opacity:.28}
.st-list{list-style:none;margin:0;padding:6px 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;counter-reset:seat}
.st-list li{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-top:1px dashed var(--line);font-weight:600;word-break:break-word}
.st-list li:before{counter-increment:seat;content:counter(seat);min-width:18px;color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.st-list li.hit{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:8px}
.st-card.nohit{opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-svg .tbl{fill:color-mix(in srgb,var(--tt,var(--accent-soft)) 22%,var(--surface))}}
:root[data-theme="dark"] .st-svg .tbl{fill:color-mix(in srgb,var(--tt,var(--accent-soft)) 22%,var(--surface))}

/* songs tab */
.sg-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.sg-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px 9px;border-bottom:1px solid var(--line);background:linear-gradient(150deg,var(--music-soft),var(--surface) 80%)}
.sg-h h3{margin:0;font:600 19px/1.2 var(--serif);color:var(--music)}
.sg-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.sg-row{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.sg-row:first-child{border-top:0}
.sg-ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--music-soft);color:var(--music);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.sg-ic svg{width:15px;height:15px}
.sg-tx{min-width:0;flex:1;padding-top:4px}
.sg-lb{display:block;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
.sg-nm{font-weight:600;white-space:pre-wrap;word-break:break-word}
.sg-cue .sg-nm{font-size:16px}

/* materials tab */
.mt-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.mt-k{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 4px 9px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.mt-k b{display:block;font:700 24px/1.05 var(--serif)}
.mt-k span{font-size:11px;color:var(--muted)}
.mt-k.over b{color:var(--alert)} .mt-k.today b{color:var(--accent)} .mt-k.soon b{color:var(--gold)} .mt-k.done b{color:var(--ok)}
.mt-k.on{outline:2px solid var(--accent);outline-offset:-1px}
.mt-bar{height:7px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:2px 0 14px}
.mt-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--ok))}
.mt-who{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
.mt-who h3{margin:0;padding:12px 16px 8px;font:600 18px/1.2 var(--serif);color:var(--accent)}
.mt-whoh{display:flex;align-items:center;justify-content:space-between;padding-right:10px}
.mt-whoh button{border:0;background:none;color:var(--accent);font:600 12.5px var(--sans);cursor:pointer;padding:6px}
.mt-pr{display:flex;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line)}

.mt-pr .ct{flex:1;font-size:12.5px;color:var(--muted);line-height:1.35}

.mt-pr .callbtn{flex:none}
.mt-h{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font:700 17px/1.2 var(--serif);color:var(--accent)}
.mt-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.mt-h small{font:600 11.5px var(--sans);color:var(--muted)}
.mt-item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:11px 12px 11px 13px;margin-bottom:8px;box-shadow:var(--shadow);scroll-margin-top:120px}
.mt-item.k-over{border-left-color:var(--alert)} .mt-item.k-today{border-left-color:var(--accent)} .mt-item.k-soon{border-left-color:var(--gold)} .mt-item.k-later{border-left-color:var(--tiffany)}
.mt-item.k-done{border-left-color:var(--ok);opacity:.62} .mt-item.k-na{opacity:.6}
.mt-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.mt-name{font-weight:700;font-size:15.5px;line-height:1.35;word-break:break-word}
.mt-item.k-done .mt-name{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 70%,transparent)}
.mt-st{flex:none;border:0;border-radius:999px;padding:6px 11px;font:700 12px var(--sans);cursor:pointer;background:var(--surface-2);color:var(--muted);white-space:nowrap}

.mt-st.done{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.mt-st.na{cursor:default}
.mt-act{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
.mt-act .dt{font-weight:700;border-radius:4px;padding:0 2px}
.mt-act .dt.past{text-decoration:line-through;opacity:.6;font-weight:600}
.mt-act .dt.now{background:var(--accent-soft);color:var(--accent)}
.mt-act .dt.fut{color:var(--gold)}
.mt-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);line-height:1.3}
.tag svg{width:12px;height:12px;flex:none}
.tag.pic{background:color-mix(in srgb,var(--tiffany) 26%,var(--surface));color:var(--gold)}
.tag.date.over{background:var(--alert-soft);color:var(--alert)}
.tag.date.today{background:var(--accent);color:var(--accent-ink)}
.tag.date.soon{background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--gold)}
.tag.date.later{background:var(--surface-2);color:var(--ink)}
.tag.warn{background:var(--alert-soft);color:var(--alert)}
.tag.ditto{font-style:italic}
/* my day */
.me-hero{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 16px;margin:2px 0 14px;box-shadow:inset 0 4px 0 var(--red);
  background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 26%,var(--surface)) 0%,var(--surface) 55%,color-mix(in srgb,var(--tiffany) 24%,var(--surface)) 100%)}
.me-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.me-hero h1{font:600 34px/1.1 var(--serif);color:var(--accent);margin:4px 0 8px}
.me-roles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.me-roles .tag{font-size:12.5px;padding:4px 10px}

.me-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.me-sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 4px 8px;text-align:center}
.me-sum b{display:block;font:700 22px/1.1 var(--serif);color:var(--ink)}
.me-sum span{font-size:11px;color:var(--muted)}
.me-seat{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.me-seat b{display:block;font:600 19px/1.2 var(--serif);margin-top:2px}
.me-seat small{color:var(--muted);font-size:12px}

.me-seat .chip svg{width:16px;height:16px}
.me-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 10px;font:600 21px/1.2 var(--serif);margin:20px 0 6px}
.me-h small{font:12px/1.3 var(--sans);color:var(--muted)}
.me-grp{margin:16px 0 8px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700}
.me-pick{display:flex;flex-wrap:wrap;gap:8px}

.chip.mep small{font-size:11px;color:var(--muted)}
mark.me-mk{background:color-mix(in srgb,var(--tiffany) 45%,transparent);color:inherit;border-radius:4px;padding:0 2px;font-weight:600}

.modal textarea{min-height:120px;max-height:55vh;resize:vertical}
.modal textarea:focus,.modal input:focus{border-color:var(--accent)}
.modal .ma{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal p{margin:0 0 10px;color:var(--muted);font-size:13.5px}

/* ── sheet model ── */
function model(si){
  var sh = DATA.sheets[si]; if(!sh) return null;
  var D = sh.display||[], R = D.length, C = 0, cov = {}, mAt = {};
  D.forEach(function(row){ if(row.length>C) C=row.length; });
  (sh.merges||[]).forEach(function(m){
    mAt[m[0]+','+m[1]] = m;
    for(var r=m[0]; r<=m[2]; r++) for(var c=m[1]; c<=m[3]; c++) if(r!==m[0]||c!==m[1]) cov[r+','+c]=[m[0],m[1]];
  });
  function at(arr,r,c,d){ return arr && arr[r-1] && arr[r-1][c-1]!=null ? arr[r-1][c-1] : d; }
  return {
    si:si, sh:sh, R:R, C:C,
    get:function(r,c){ return String(at(D,r,c,'')); },
    bg:function(r,c){ return at(sh.bg,r,c,'#ffffff'); },
    fc:function(r,c){ return at(sh.fc,r,c,'#000000'); },
    bold:function(r,c){ return at(sh.bold,r,c,'normal')==='bold'; },
    covered:function(r,c){ return cov[r+','+c]; },
    mergeAt:function(r,c){ return mAt[r+','+c]; }
  };
}

function rundownSheetIndex(){
  for (var i=0;i<DATA.sheets.length;i++){ var m=model(i); if(findHeader(m)) return i; }
  return 0;
}
function findHeader(m){
  for (var r=1;r<=m.R;r++) for (var c=1;c<=m.C;c++) if (m.get(r,c).trim().toLowerCase()==='time') return {r:r,c:c};
  return null;
}
function isTime(s){ return /^\s*\d{1,2}:\d{2}/.test(s); }
function parseRange(s){
  var m = /^\s*(\d{1,2}):(\d{2})(?:\s*[-–~至]\s*(\d{1,2}):(\d{2}))?/.exec(s||'');
  if(!m) return {start:null,end:null,head:'',tail:s};
  return {start:+m[1]*60+ +m[2], end:m[3]!=null?(+m[3]*60+ +m[4]):null, head:m[1]+':'+m[2], tail:s.slice(s.indexOf(m[2])+2)};
}
function parseDate(s){ var m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||''); return m?{y:+m[3],mo:+m[2],d:+m[1]}:null; }
function dayNum(o){ return Math.round(Date.UTC(o.y,o.mo-1,o.d)/864e5); }

function parse(){
  var si = rundownSheetIndex(), m = model(si), h = findHeader(m);
  var P = { si:si, m:m, info:[], sections:[], title:'', subtitle:null };
  if(!h){ return P; }
  var cols=[]; for (var c=h.c;c<=m.C;c++) if(m.get(h.r,c).trim()) cols.push(c);
  var cT=cols[0], cW=cols[1]||cT+1, cD=cols[2]||cT+2, cE=cols[3]||cT+3;
  P.cols={t:cT,w:cW,d:cD,e:cE}; P.hdr=h.r;
  P.labels={t:m.get(h.r,cT),w:m.get(h.r,cW),d:m.get(h.r,cD),e:m.get(h.r,cE)};

  for (var r=1;r<h.r;r++){
    var cells=[];
    for (var c2=1;c2<=m.C;c2++){ if(m.covered(r,c2)) continue; var v=m.get(r,c2); if(v.trim()) cells.push({r:r,c:c2,v:v,red:isRed(m.fc(r,c2))}); }
    if(r===1 && cells.length){ P.title=cells[0]; P.subtitle=cells[1]||null; continue; }
    if(cells.length) P.info.push({r:r,cells:cells});
  }

  var sec=null, blk=null, card=null;
  for (var r2=h.r+1;r2<=m.R;r2++){
    var t=m.get(r2,cT), w=m.get(r2,cW), d=m.get(r2,cD), e=m.get(r2,cE);
    var tCov=!!m.covered(r2,cT), wCov=!!m.covered(r2,cW), eCov=!!m.covered(r2,cE);
    if(!t.trim() && !w.trim() && !d.trim() && !e.trim()) continue;
    if(t.trim() && !isTime(t) && !w.trim() && !d.trim() && !e.trim()){
      sec={title:t,r:r2,c:cT,blocks:[],date:parseDate(t),yellow:isYellow(m.bg(r2,cT))}; P.sections.push(sec); blk=null; continue;
    }
    if(!sec){ sec={title:'',r:0,blocks:[],date:null}; P.sections.push(sec); }
    if(t.trim() && !tCov){
      var pr=parseRange(t);
      blk={time:t,r:r2,start:pr.start,end:pr.end,head:pr.head,tail:pr.tail,cards:[]}; sec.blocks.push(blk); card=null;
    } else if(!blk){ blk={time:'',r:r2,start:null,end:null,cards:[]}; sec.blocks.push(blk); card=null; }
    var tint=null; [cT,cW,cD].forEach(function(cc){ var b=m.bg(r2,cc); if(!tint && !isWhite(b) && !isRed(b) && !isYellow(b)) tint=hex(b); });
    var row={r:r2,who:w,wCov:wCov,desc:d,rem:e,eCov:eCov,remRed:isRed(m.bg(r2,cE))||isRed(m.fc(r2,cE)),tint:tint};
    var startsCard = !wCov && w.trim();
    if(startsCard || !card){ card={rows:[row],tint:tint,title:startsCard?w:''}; blk.cards.push(card); }
    else card.rows.push(row);
  }
  // end times + labels
  P.sections.forEach(function(s){
    var starts = s.blocks.filter(function(b){return b.start!=null;}).map(function(b){return b.start;}).sort(function(a,b){return a-b;});
    s.blocks.forEach(function(b){
      if(b.start==null) return;
      var nx = starts.filter(function(x){return x>b.start;})[0];
      b.endEff = b.end!=null && b.end>b.start ? b.end : (nx!=null ? nx : b.start+30);
      var c0=b.cards[0], r0=c0&&c0.rows[0];
      b.label = (c0&&c0.title) || (r0 && (r0.desc||r0.rem||'').split('\n')[0]) || '';
      b.tint = c0 && c0.tint;
    });
  });
  P.event = P.sections.filter(function(s){return s.date && /event/i.test(s.title);})[0] || P.sections.filter(function(s){return s.date;}).slice(-1)[0] || null;
  return P;
}

/* ── time ── */
function hkNow(){
  if(state.fakeNow) return state.fakeNow;
  try{
    var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    var g=function(k){ return +p.filter(function(x){return x.type===k;})[0].value; };
    return {y:g('year'),mo:g('month'),d:g('day'),min:(g('hour')%24)*60+g('minute')};
  }catch(e){ var n=new Date(Date.now()+8*3600e3); return {y:n.getUTCFullYear(),mo:n.getUTCMonth()+1,d:n.getUTCDate(),min:n.getUTCHours()*60+n.getUTCMinutes()}; }
}
function fmtMin(m){ return Math.floor(m/60)+':'+('0'+(m%60)).slice(-2); }
function hkClock(d){
  try{ return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d); }
  catch(e){ var n=new Date(d.getTime()+8*3600e3); return ('0'+n.getUTCHours()).slice(-2)+':'+('0'+n.getUTCMinutes()).slice(-2); }
}
function statusOf(P){
  var now=hkNow(), res={now:now,current:[],next:null,today:null,days:null};
  if(!P.event) return res;
  res.days = dayNum(P.event.date) - dayNum(now);
  P.sections.forEach(function(s){
    if(!s.date) return;
    var dd = dayNum(s.date) - dayNum(now);
    s.blocks.forEach(function(b){
      b.st = '';
      if(dd<0) b.st='past';
      else if(dd===0 && b.start!=null){
        if(now.min>=b.endEff) b.st='past';
        else if(now.min>=b.start) { b.st='now'; res.current.push(b); }
      }
    });
    if(dd===0){
      res.today=s;
      var fut=s.blocks.filter(function(b){return b.start!=null && b.start>now.min;}).sort(function(a,b){return a.start-b.start;});
      if(fut.length){ res.next=fut[0]; fut.forEach(function(b){ if(b.start===fut[0].start) b.st='next'; }); }
    }
  });
  return res;
}

/* ── render: rundown ── */
function remHtml(row,si,cE){
  if(row.eCov) return '';
  if(!row.rem.trim()) return '<span class="ph"'+cellAttr(si,row.r,cE)+'>+ remark</span>';
  var music=/^\s*BGM/i.test(row.rem), cls=row.remRed?'alert':(music?'music':'');
  return '<div class="rem '+cls+'"'+cellAttr(si,row.r,cE)+'>'+(row.remRed?I.alert:(music?I.music:I.note))+'<div>'+rich(row.rem)+'</div></div>';
}
function rowMatches(row,b){
  var q=state.q.trim().toLowerCase(); if(!q) return true;
  return ([row.who,row.desc,row.rem,b.time].join('\n')+trHay([row.who,row.desc,row.rem])).toLowerCase().indexOf(q)>=0;
}
function blockHtml(P,b){
  var si=P.si, C=P.cols, cards=[];
  b.cards.forEach(function(card){
    var rows=card.rows.filter(function(r){ return rowMatches(r,b) && (!ROWF || ROWF(r,b,card)); });
    if(!rows.length) return;
    var html='', first=true;
    rows.forEach(function(row){
      var inner='';
      if(row===card.rows[0] && card.title) inner+='<h3 class="who"'+cellAttr(si,row.r,C.w)+'>'+rich(row.who)+'</h3>';
      else if(!row.wCov && !row.who.trim()) inner+='<span class="ph"'+cellAttr(si,row.r,C.w)+'>+ people / action</span>';
      if(row.desc.trim()) inner+='<p class="desc"'+cellAttr(si,row.r,C.d)+'>'+rich(row.desc)+'</p>';
      else inner+='<span class="ph"'+cellAttr(si,row.r,C.d)+'>+ description</span>';
      inner+=remHtml(row,si,C.e);
      html+= first ? inner : '<div class="sub">'+inner+'</div>';
      first=false;
    });
    var tint=card.tint;
    cards.push('<article class="ent'+(tint?' tinted':'')+'"'+(tint?' style="--tint:'+tint+'"':'')+'>'+
      (cards.length===0 && (b.st==='now'||b.st==='next') ? '<span class="badge">'+(b.st==='now'?'NOW':'NEXT')+'</span>' : '')+html+'</article>');
  });
  if(!cards.length) return '';
  var t='';
  if(b.time){
    t = b.head ? '<b'+cellAttr(si,b.r,C.t)+'>'+hl(b.head)+'</b>'+(b.tail.trim()?'<em>'+hl(b.tail)+'</em>':'')
               : '<b'+cellAttr(si,b.r,C.t)+'>'+hl(b.time)+'</b>';
  }
  return '<li class="blk '+(b.st||'')+(b.time?'':' untimed')+'" id="b-'+b.r+'"><div class="t">'+t+'</div><div class="rail"><i class="dot"></i></div><div class="cards">'+cards.join('')+'</div></li>';
}
function ganttHtml(P,S){
  var s=P.event; if(!s) return '';
  var bl=s.blocks.filter(function(b){return b.start!=null;});
  if(bl.length<3) return '';
  var t0=Math.floor(Math.min.apply(null,bl.map(function(b){return b.start;}))/60)*60;
  var t1=Math.ceil(Math.max.apply(null,bl.map(function(b){return b.endEff;}))/60)*60;
  var PX=2, lanes=[], items=bl.slice().sort(function(a,b){return a.start-b.start || (b.endEff-b.start)-(a.endEff-a.start);});
  items.forEach(function(b){
    var L=-1; for(var i=0;i<lanes.length;i++) if(lanes[i]<=b.start){L=i;break;}
    if(L<0){ L=lanes.length; lanes.push(0); }
    lanes[L]=Math.max(b.endEff,b.start+12); b.lane=L;
  });
  var W=(t1-t0)*PX, H=22+lanes.length*29;
  var h='<div class="card gcard"><div class="card-h"><h3>Day at a glance</h3><small>'+esc(s.title.replace(/^.*?(\d)/,'$1'))+' · tap a bar</small></div>'+
        '<div class="gscroll" id="gscroll"><div class="gantt" style="width:'+W+'px;height:'+H+'px">';
  for(var m=t0;m<=t1;m+=60) h+='<div class="gt" style="left:'+((m-t0)*PX)+'px"><span>'+fmtMin(m)+'</span></div>';
  items.forEach(function(b){
    var w=Math.max((b.endEff-b.start)*PX-2,10);
    h+='<button type="button" class="gb '+(b.tint?'tinted':'plain')+(b.st==='now'?' now':'')+'" data-jump="b-'+b.r+'" title="'+esc(b.time+' '+b.label)+'" style="left:'+((b.start-t0)*PX)+'px;top:'+(20+b.lane*29)+'px;width:'+w+'px'+(b.tint?';--tint:'+b.tint:'')+'">'+esc(b.label)+'</button>';
  });
  if(S.today===s && S.now.min>=t0 && S.now.min<=t1) h+='<div class="gnow" id="gnow" style="left:'+((S.now.min-t0)*PX)+'px"></div>';
  return h+'</div></div></div>';
}
function heroHtml(P,S){
  var ev=P.event, h='<section class="hero"><div class="eyebrow">'+(P.subtitle?'<span class="ver'+(P.subtitle.red?' red':'')+'"'+cellAttr(P.si,P.subtitle.r,P.subtitle.c)+'>'+esc(P.subtitle.v)+'</span>':'')+'</div>';
  h+='<h1'+(P.title?cellAttr(P.si,P.title.r,P.title.c):'')+'>'+esc(P.title?P.title.v:'Wedding Rundown')+'</h1>';
  var meta=P.info.filter(function(row){ return row.cells.length<=2 && !phonesIn(row.cells.map(function(c){return c.v;}).join(' ')).length && row.cells[0].c===P.cols.t; }).slice(0,4);
  if(meta.length){
    h+='<div class="meta">'+meta.map(function(row){
      var a=row.cells[0], b=row.cells[1], k, v, vc;
      if(b){ k=a.v.replace(/[:：]\s*$/,'').trim(); v=b; } else { var i=a.v.indexOf(':'); k=i>0?a.v.slice(0,i):''; v={r:a.r,c:a.c,v:i>0?a.v.slice(i+1).trim():a.v,red:a.red}; }
      return '<div><span>'+esc(k)+'</span><b class="'+(v.red?'red':'')+'"'+cellAttr(P.si,v.r,v.c)+'>'+esc(v.v)+'</b></div>';
    }).join('')+'</div>';
  }
  if(S.days!=null){
    if(S.days>1) h+='<div class="count"><b>'+S.days+'</b><span>days to go · Hong Kong time</span></div>';
    else if(S.days===1) h+='<div class="count"><b>Tomorrow</b><span>See the 23/10 schedule below</span></div>';
    else if(S.days===0) h+='<div class="count"><b>Today</b><span>HK time '+fmtMin(S.now.min)+'</span></div>';
  }
  return h+'</section>';
}
function nowHtml(P,S){
  if(!S.today) return '';
  var h='<div class="nowcard"><h4>Happening now · '+fmtMin(S.now.min)+'</h4>';
  if(S.current.length) S.current.forEach(function(b){ h+='<div class="row"><span class="tm">'+esc(b.time)+'</span><span>'+esc(b.label)+'</span></div>'; });
  else h+='<div class="row"><span class="nx">Nothing scheduled right now.</span></div>';
  if(S.next){
    var same=S.today.blocks.filter(function(b){return b.start===S.next.start;});
    h+='<h4 style="margin-top:10px;color:var(--gold)">Up next · in '+(S.next.start-S.now.min)+' min</h4>';
    same.forEach(function(b){ h+='<div class="row"><span class="tm">'+esc(b.time)+'</span><span>'+esc(b.label)+'</span></div>'; });
  }
  h+='<div class="act"><button class="btn primary" type="button" data-jump="'+(S.current[0]?'b-'+S.current[0].r:S.next?'b-'+S.next.r:'')+'">Jump to now</button></div></div>';
  return h;
}
function renderRundown(P){

  h+=heroHtml(P,S)+nowHtml(P,S);
  h+='<div class="tools"><label class="search">'+I.search+'<input id="q" type="search" placeholder="Search people, tasks, songs…" value="'+esc(state.q)+'" autocomplete="off"></label></div>';
  h+='<div class="chips">'+P.sections.map(function(s){ return '<button type="button" class="chip" data-jump="s-'+s.r+'">'+esc(s.title||'Rundown')+'</button>'; }).join('')+'</div>';
  if(!state.q.trim()) h+=ganttHtml(P,S);

}
function listHtml(P){
  var out='', any=false;
  P.sections.forEach(function(s){
    var items=s.blocks.map(function(b){ return blockHtml(P,b); }).filter(Boolean);
    if(!items.length && state.q.trim()) return;
    any = any || items.length>0;
    out+='<section class="sec" id="s-'+s.r+'">'+(s.title?'<h2 class="sec-h'+(s.yellow?' hl':'')+'"'+cellAttr(P.si,s.r,s.c)+'>'+hl(s.title)+'</h2>':'')+'<ol class="tl">'+items.join('')+'</ol></section>';
  });
  if(!any) out='<p class="empty">No matches for “'+esc(state.q)+'”.</p>';
  return out;
}

function renderInfo(P){
  var si=P.si, h='<div class="eyebrow" style="margin:4px 0 0">'+(P.subtitle?'<span class="'+(P.subtitle.red?'red':'')+'"'+cellAttr(si,P.subtitle.r,P.subtitle.c)+'>'+esc(P.subtitle.v)+'</span>':'')+'</div>';
  h+='<div class="info-title"'+(P.title?cellAttr(si,P.title.r,P.title.c):'')+'>'+esc(P.title?P.title.v:'')+'</div>';
  var cards=[[],[]], inContacts=false;
  P.info.forEach(function(row){
    var byC={}; row.cells.forEach(function(c){ byC[c.c]=c; });
    var B=byC[P.cols.t], C=byC[P.cols.w], D=byC[P.cols.d];
    var txt=row.cells.map(function(c){return c.v;}).join(' ');
    if(phonesIn(txt).length || (C && !B) || (B && C && D)) inContacts=true;
    var list=cards[inContacts?1:0], s='';
    if(B && C){
      if(D || !(/[:：]\s*$/.test(B.v))){ s+='<div class="grp"'+cellAttr(si,B.r,B.c)+'>'+esc(B.v)+'</div>'; B=null; }
    }
    if(B && C && !D){
      s+=kv(esc(B.v.replace(/[:：]\s*$/,'').trim()), C, si, null, B);
    } else if(B && !C){
      var i=B.v.indexOf(':');
      var k=i>0?B.v.slice(0,i).trim():'', v=i>0?B.v.slice(i+1):B.v;
      s+='<div class="kv"><div class="k">'+esc(k)+'</div><div class="v'+(B.red?' red':'')+'"'+cellAttr(si,B.r,B.c)+'>'+rich(v.replace(/^\s+|\s+$/g,''),true)+'</div>'+calls(v)+'</div>';
    } else if(C){
      s+=kv(esc(C.v), D, si, {r:row.r,c:P.cols.d}, C);

    list.push(s);
    row.cells.filter(function(c){ return c!==byC[P.cols.t] && c!==byC[P.cols.w] && c!==byC[P.cols.d]; }).forEach(function(c){
      list.push('<div class="kv"><div class="k"></div><div class="v"'+cellAttr(si,c.r,c.c)+'>'+rich(c.v)+'</div></div>');
    });
  });
  if(cards[0].length) h+='<div class="card" style="margin-top:14px">'+cards[0].join('')+'</div>';
  if(cards[1].length) h+='<div class="card-h" style="padding:6px 2px 8px"><h3>Contacts</h3><small>Tap number to call · green = WhatsApp</small></div><div class="card">'+cards[1].join('')+'</div>';
  $('#main').innerHTML=h;
}
function kv(kHtml, V, si, emptyRef, Kcell){
  var k = Kcell ? '<div class="k"'+cellAttr(si,Kcell.r,Kcell.c)+'>'+kHtml+'</div>' : '<div class="k">'+kHtml+'</div>';

function calls(s){
  var re=/([^()\d:_\/]+?)\s*\(\s*Tel:?\s*([^)]*)\)/gi, m, out=[];
  while((m=re.exec(s))){ var n=m[1].replace(/^[\s\d)._-]+/,'').trim(), nums=phonesIn(m[2]);
    nums.forEach(function(num,i){ var lbl=(n||num)+(nums.length>1?(num.indexOf('852')===0?' (HK)':' (+'+num.slice(0,num.length-10||1)+')'):'');
      out.push('<a class="callbtn" href="tel:+'+num+'">'+I.phone+esc(lbl)+'</a><a class="callbtn w" href="https://wa.me/'+num+'" target="_blank" rel="noopener">'+I.wa+'WhatsApp</a>'); }); }
  return out.length?'<div class="callrow">'+out.join('')+'</div>':'';
}

var PUBLIC_URL='https://wondermaple.github.io/wedding-rundown/';
var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
var ST_LABEL={todo:'To do',prog:'In progress',done:'Done'};
function matSheetIndex(){ for(var i=0;i<DATA.sheets.length;i++) if(/material|物資|物品/i.test(DATA.sheets[i].name)) return i; return -1; }
function contactBook(){
  var book={}; if(!P || !P.info) return book;
  P.info.forEach(function(row){ row.cells.forEach(function(c){
    var re=/([A-Za-z][A-Za-z'\-]*)\s*\(\s*Tel:?\s*([^)]*)\)/g, m;
    while((m=re.exec(c.v))){ var ph=phonesIn(m[2]), k=m[1].toLowerCase(); if(ph.length && !book[k]) book[k]={name:m[1], num:ph[0]}; }
  }); });
  return book;
}
function parseDates(s, yr){
  var re=/(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?(?:\s+(\d{1,2}(?::\d{2})?\s*(?:am|pm)|lunch hour|noon))?/gi, m, out=[];
  while((m=re.exec(s||''))){ var d=+m[1], mo=MON[m[2].toLowerCase()]; out.push({y:yr, mo:mo, d:d, n:dayNum({y:yr,mo:mo,d:d}), time:m[3]||'', at:m.index, len:m[0].length}); }
  return out;
}
function fmtD(d){
  var w=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(d.y,d.mo-1,d.d)).getUTCDay()];
  return w+' '+d.d+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.mo-1]+(d.time?' '+d.time:'');
}
function capName(n){ return n.charAt(0).toUpperCase()+n.slice(1); }
function picsOf(action, loc, names){
  var found=[], seen={}, alt=names.join('|');
  function addN(n){ var k=n.toLowerCase(); if(!seen[k]){ seen[k]=1; found.push(capName(n)); } }
  var re=new RegExp('\\b('+alt+')(?:\\s*(?:and|&|,)\\s*('+alt+'))?\\s+to\\b','gi'), m;
  while((m=re.exec(action))){ addN(m[1]); if(m[2]) addN(m[2]); }
  if(!found.length && !/^\s*no action/i.test(action)){ var lm=(loc||'').match(new RegExp('\\b('+alt+')\\b','gi')); if(lm) lm.forEach(addN); }
  return found;
}
function mentionsOf(action, names, pics){
  var low={}, out=[]; pics.forEach(function(p){ low[p.toLowerCase()]=1; });
  names.forEach(function(n){ if(!low[n.toLowerCase()] && new RegExp('\\b'+n+'\\b(?!\\s*room)','i').test(action)){ low[n.toLowerCase()]=1; out.push(capName(n)); } });
  return out;
}
function stOf(v){
  var s=(v||'').trim().toLowerCase();
  if(!s || /^(to ?do|pending|not started|未開始|未)$/.test(s)) return 'todo';
  if(/^(done|completed?|ok|yes|✓|✔|完成|已完成|搞掂)$/.test(s)) return 'done';
  if(/progress|doing|進行|處理中/.test(s)) return 'prog';
  return 'custom';
}
function parseMaterials(si){
  var m=model(si), hdr=0, cS=0;
  for(var r=1;r<=Math.min(m.R,5) && !hdr;r++){ var nb=0; for(var c=1;c<=m.C;c++) if(m.get(r,c).trim() && m.bold(r,c)) nb++; if(nb>=2) hdr=r; }
  if(!hdr) hdr=1;
  var hc=[]; for(var c2=1;c2<=m.C;c2++) if(m.get(hdr,c2).trim()) hc.push(c2);
  hc.forEach(function(c){ if(/status|狀態/i.test(m.get(hdr,c))) cS=c; });
  var dc=hc.filter(function(c){ return c!==cS; }), cI=dc[0]||1, cL=dc[1]||cI+1, cA=dc[2]||cI+2;
  if(!cS) cS=Math.max(cI,cL,cA)+1;
  var book=contactBook(), names=['Groom','Bride','Parents'].concat(Object.keys(book).map(function(k){ return book[k].name; }));
  try{ mePeople().forEach(function(p){ if(p.grp!=='guest' && p.grp!=='family' && !names.some(function(n){ return n.toLowerCase()===p.name.toLowerCase(); })) names.push(p.name); }); }catch(e){}
  var yr=(P && P.event && P.event.date) ? P.event.date.y : hkNow().y;
  var groups=[{title:m.get(hdr,cI), r:hdr, items:[]}], cur=groups[0], prev='';
  for(var r2=hdr+1;r2<=m.R;r2++){
    var it=m.get(r2,cI), lo=m.get(r2,cL), ac=m.get(r2,cA), st=m.get(r2,cS);
    if(!it.trim() && !lo.trim() && !ac.trim()) continue;
    if(it.trim() && !lo.trim() && !ac.trim()){ cur={title:it, r:r2, items:[]}; groups.push(cur); continue; }
    var ditto=/^\s*(ditto|same as above|同上|〃|")\s*$/i.test(ac), eff=ditto?prev:ac; if(!ditto) prev=ac;
    var noAct=/^\s*no action/i.test(eff), pics=picsOf(eff, lo, names);
    cur.items.push({r:r2, item:it, loc:lo, act:ac, eff:eff, ditto:ditto, noAct:noAct, st:st, stk:noAct?'na':stOf(st), dates:parseDates(eff, yr), pics:pics, also:mentionsOf(eff, names, pics), g:cur.title});
  }
  return {si:si, m:m, cols:{i:cI,l:cL,a:cA,s:cS}, hdr:hdr, groups:groups.filter(function(g){ return g.items.length; }), book:book};
}
function matTiming(x, today){
  if(x.noAct) return {k:'na'};
  var fut=x.dates.filter(function(d){ return d.n>=today; }).sort(function(a,b){ return a.n-b.n; });
  if(x.stk==='done') return {k:'done', next:fut[0]||null};
  if(!x.dates.length) return {k:'nodate'};
  if(!fut.length){ var last=x.dates.slice().sort(function(a,b){ return b.n-a.n; })[0]; return {k:'over', next:last, label:'Overdue · was '+fmtD(last)}; }
  var n=fut[0], dd=n.n-today;
  return {k: dd===0?'today':(dd<=3?'soon':'later'), next:n, dd:dd, label:(dd===0?'Today':dd===1?'Tomorrow':'In '+dd+' days')+' · '+fmtD(n)};
}
function matData(){
  var si=matSheetIndex(); if(si<0) return null;
  var M=parseMaterials(si), now=hkNow(), today=dayNum(now), all=[];
  M.groups.forEach(function(g){ g.items.forEach(function(x){
    x.t=matTiming(x, today);
    x.missed = x.stk==='todo' && x.t.k!=='over' && x.t.k!=='na' ? x.dates.filter(function(d){ return d.n<today; }).sort(function(a,b){ return b.n-a.n; })[0] || null : null;
    all.push(x);
  }); });
  return {M:M, all:all, today:today, now:now};
}
function matPeople(D){
  var people={};
  D.all.forEach(function(x){ x.pics.concat(x.also).forEach(function(n){ var k=n.toLowerCase(); (people[k]=people[k]||{name:n, key:k, items:[], lead:0}).items.push(x); if(x.pics.indexOf(n)>=0) people[k].lead++; }); });
  return Object.keys(people).map(function(k){ return people[k]; }).sort(function(a,b){ return b.lead-a.lead || b.items.length-a.items.length; });
}
function openOf(items){ return items.filter(function(x){ return x.t.k!=='done' && x.t.k!=='na'; }); }

function matFilter(x){

    if(/^[\x00-\x7f]+$/.test(q)){ if(!new RegExp('(^|[^a-z0-9])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(hay)) return false; }
    else if(hay.indexOf(q)<0) return false; }

}
function dateMarked(text, yr, today){
  var ds=parseDates(text, yr), out='', last=0;
  ds.forEach(function(d){ out+=esc(text.slice(last, d.at)); out+='<span class="dt '+(d.n<today?'past':d.n===today?'now':'fut')+'">'+esc(text.substr(d.at, d.len))+'</span>'; last=d.at+d.len; });
  return out+esc(text.slice(last));
}

function matListHtml(D){

    D.M.groups.forEach(function(g){
      var its=g.items.filter(function(x){ return list.indexOf(x)>=0; }); if(!its.length) return;
      h+='<div class="mt-h"'+cellAttr(D.M.si,g.r,D.M.cols.i)+'>'+esc(g.title)+' <small>'+its.length+'</small></div>'+its.map(function(x){ return matItemHtml(D,x); }).join('');
    });

  }
  var rank={over:0,today:1,soon:2,later:3,nodate:4,done:5,na:6};
  list.sort(function(a,b){ return rank[a.t.k]-rank[b.t.k] || ((a.t.next&&b.t.next)?a.t.next.n-b.t.next.n:0) || a.r-b.r; });
  var lastH=null;

function seatSheetIndex(){ for(var i=0;i<DATA.sheets.length;i++) if(/seat|座位|坐位|枱|檯/i.test(DATA.sheets[i].name)) return i; return -1; }
function parseSeating(si){
  var m=model(si), blocks=[], cur=[], tables=[];
  for(var r=1;r<=m.R;r++){
    var has=false; for(var c=1;c<=m.C;c++) if(!m.covered(r,c) && m.get(r,c).trim()){ has=true; break; }
    if(!has){ if(cur.length){ blocks.push(cur); cur=[]; } continue; }
    cur.push(r);
  }
  if(cur.length) blocks.push(cur);
  blocks.forEach(function(rows){
    for(var c=1;c<=m.C;c++){
      var cells=rows.filter(function(r){ return !m.covered(r,c) && m.get(r,c).trim(); }).map(function(r){ return {r:r,c:c,v:m.get(r,c)}; });
      if(!cells.length) continue;
      var ti=-1; cells.forEach(function(x,i){ if(ti<0 && /table|枱|檯|席|桌/i.test(x.v)) ti=i; });
      tables.push({title: ti>=0?cells[ti]:null, guests: cells.filter(function(x,i){ return i!==ti; })});
    }
  });
  return tables;
}

  var s='<svg class="st-svg" viewBox="0 0 '+W+' '+W+'" role="img" aria-label="'+esc(title||'Table')+'">';
  s+='<circle class="tbl" cx="'+C+'" cy="'+C+'" r="'+rT+'"/>';
  s+='<text class="tname" x="'+C+'" y="'+(l2?C-6:C+2)+'" text-anchor="middle">'+esc(l1)+'</text>';

  var m=model(state.sheet), sh=m.sh, minC=1e9, maxC=0, maxR=0;
  for(var r=1;r<=m.R;r++) for(var c=1;c<=m.C;c++) if(m.get(r,c).trim()||m.mergeAt(r,c)){ minC=Math.min(minC,c); maxC=Math.max(maxC,c); maxR=Math.max(maxR,r); }

    for(var pass2=0;pass2<3;pass2++) (sh.merges||[]).forEach(function(g){ var keep=false; for(var x=g[0];x<=g[2];x++) if(!skip[x]) keep=true; if(keep) for(var y=g[0];y<=g[2];y++) delete skip[y]; });
  }
  for(var r2=1;r2<=maxR;r2++){
    if(skip[r2]) continue;
    h+='<tr><th>'+r2+'</th>';
    for(var c2=minC;c2<=maxC;c2++){
      if(m.covered(r2,c2)) continue;

      if(mg){ var rs=Math.min(mg[2],maxR)-r2+1, cs=Math.min(mg[3],maxC)-c2+1; if(rs>1) span+=' rowspan="'+rs+'"'; if(cs>1) span+=' colspan="'+cs+'"'; }
      var bg=m.bg(r2,c2), fc=m.fc(r2,c2), st='', cls=[];
      if(!isWhite(bg)){ st+='background:'+hex(bg)+';'; cls.push('f'); }
      if(isRed(fc)) st+='color:#d01d1d;';
      if(m.bold(r2,c2)) cls.push('b');
      h+='<td'+span+(cls.length?' class="'+cls.join(' ')+'"':'')+(st?' style="'+st+'"':'')+cellAttr(state.sheet,r2,c2)+'>'+(m.get(r2,c2)?rich(m.get(r2,c2),true):'')+'</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table></div>';
  $('#main').innerHTML=h;

    $('#main').innerHTML='<div class="eyebrow" style="margin:4px 0 2px">My Role</div><div class="info-title">Who are you?</div>'+
      '<p class="note-s">Pick your name once. This phone will remember it, and you’ll see only your steps, what to look after and your table.</p>'+
      '<div class="tools" style="top:57px"><label class="search">'+I.search+'<input id="meq" type="search" placeholder="Type your name…" value="'+esc(state.meq||'')+'" autocomplete="off"></label></div>'+
      '<div id="me-pick">'+mePickHtml(people)+'</div>';
    return;
  }
  var S=statusOf(PP), keepQ=state.q, steps='', nSteps=0, mine=[], first=null, nowB=null, nextB=null;
  state.q='';
  ROWF=function(row,b,card){
    var hit=function(r){ return meHit(me, r.who+'\n'+r.desc+'\n'+r.rem); };
    return hit(row) || (row===card.rows[0] && card.rows.some(hit));
  };
  PP.sections.forEach(function(s){
    var items=[];
    s.blocks.forEach(function(b){
      var hb=blockHtml(PP,b); if(!hb) return;
      items.push(hb); nSteps++; mine.push(b);
      if(!first && b.start!=null) first={b:b,s:s};
      if(S.today===s && b.start!=null){
        if(b.st==='now' && !nowB) nowB=b;
        if(b.start>S.now.min && (!nextB || b.start<nextB.start)) nextB=b;
      }
    });
    if(items.length) steps+='<section class="sec">'+(s.title?'<h2 class="sec-h'+(s.yellow?' hl':'')+'">'+esc(s.title)+'</h2>':'')+'<ol class="tl">'+items.join('')+'</ol></section>';
  });
  ROWF=null;
  var D=matData(), own=[], forYou=[];
  if(D){
    D.all.forEach(function(x){
      var resp=x.pics.concat(x.also).some(function(n){ return me.mat.indexOf(n.toLowerCase())>=0; });
      if(resp) own.push(x);
      else if(me.grp!=='guest' && meHit(me, [x.item,x.act,x.eff].join('\n'))) forYou.push(x);
    });
    var ord=function(x){ return x.t.k==='done'||x.t.k==='na' ? 1e9 : (x.t.next?x.t.next.n:5e8); };
    own.sort(function(a,b){ return ord(a)-ord(b); });
  }
  var seat=meSeat(me);
  var fd = first ? (/(\d{1,2})\/(\d{1,2})/.exec(first.s.title)||[]) : [];
  var h='<section class="me-hero"><div class="me-top"><div class="eyebrow">My Role</div><button type="button" class="chip" data-mechange="1">Change</button></div>'+
    '<h1>'+esc(me.name)+'</h1><div class="me-roles">'+roleTags(me)+'</div>'+
    '<div class="me-sum"><div><b>'+(first?esc(first.b.head||first.b.time):'–')+'</b><span>'+(fd[1]?'First call · '+fd[1]+'/'+fd[2]:'First call')+'</span></div>'+
    '<div><b>'+nSteps+'</b><span>'+(nSteps===1?'step':'steps')+'</span></div>'+
    '<div><b>'+openOf(own).length+'</b><span>to look after</span></div></div></section>';
  if(nowB || nextB){
    h+='<div class="nowcard">';
    if(nowB) h+='<h4>Now for you</h4><div class="row"><span class="tm">'+esc(nowB.time)+'</span><span>'+esc(nowB.label)+'</span></div>';
    if(nextB) h+='<h4 style="'+(nowB?'margin-top:10px;':'')+'color:var(--gold)">Next for you · in '+(nextB.start-S.now.min)+' min</h4><div class="row"><span class="tm">'+esc(nextB.time)+'</span><span>'+esc(nextB.label)+'</span></div>';
    h+='<div class="act"><button class="btn primary" type="button" data-jump="b-'+(nowB||nextB).r+'">Jump to it</button></div></div>';
  }
  if(seat) h+='<div class="card me-seat"><div><div class="eyebrow">Your table</div><b>'+esc(seat.title)+'</b><small>'+esc('Seat '+seat.seat+' of '+seat.of)+'</small></div>'+
    '<button type="button" class="chip" data-seatme="'+esc(seat.name)+'">'+I.seat+'Open seating plan</button></div>';
  h+='<div class="me-h">Your steps<small>Only steps that mention you, your role or your group</small></div>';
  h+= steps || '<p class="empty">Nothing in the rundown mentions you yet.</p>';
  if(own.length){
    h+='<div class="me-h">Things you look after<small>'+(own.length===1?'1 item':own.length+' items')+'</small></div>';
    h+='<div class="mt-list">'+own.map(function(x){ return matItemHtml(D,x); }).join('')+'</div>';
  }
  if(forYou.length){
    h+='<div class="me-h">Also for you<small>Mentions you; someone else brings it</small></div>';
    h+='<div class="mt-list">'+forYou.map(function(x){ return matItemHtml(D,x); }).join('')+'</div>';
  }
  state.q=keepQ;
  $('#main').innerHTML=h;
  if(LANG!=='zh') meMark(me);
}
function meMark(p){
  var terms=[p.name].concat(p.alias||[]); p.roles.forEach(function(r){ (r.terms||[]).forEach(function(t){ terms.push(t); }); if(!r.terms) terms.push(r.role); });
  if(p.id==='bride') terms.push('Bride','新娘'); if(p.id==='groom') terms.push('Groom','新郎');
  if(p.id==='bridemom') terms.push("Bride's mom",'Bride’s mom',"Bride's Mom",'Parents','parents','新娘媽媽');
  if(p.id==='groomparents') terms.push("Groom's dad & mom","Groom's mom","Groom's parent","Groom's Dad","Adonis's Parent",'Parents','parents');
  var asc=[], cjk=[]; terms.forEach(function(t){ t=String(t||'').trim(); if(!t) return; (/[^\x00-\x7f]/.test(t)?cjk:asc).push(escRe(t)); });
  asc.sort(function(a,b){ return b.length-a.length; });
  var src=[]; if(asc.length) src.push('(^|[^A-Za-z0-9])('+asc.join('|')+')(?![A-Za-z0-9])'); if(cjk.length) src.push('('+cjk.join('|')+')');
  if(!src.length) return; var rx=new RegExp(src.join('|'),'gi');
  [].slice.call(document.querySelectorAll('#main .tl .cards')).forEach(function(box){
    var w=document.createTreeWalker(box, NodeFilter.SHOW_TEXT), n, list=[]; while((n=w.nextNode())) list.push(n);
    list.forEach(function(t){
      if(t.parentElement.closest('.ph,a.tel,mark')) return;
      var v=t.nodeValue, out=document.createDocumentFragment(), last=0, m, any=false; rx.lastIndex=0;
      while((m=rx.exec(v))){ var pre=asc.length?(m[1]||''):'', word=asc.length?(m[2]||m[3]):m[1]; if(!word){ rx.lastIndex++; continue; } var st=m.index+pre.length;
        out.appendChild(document.createTextNode(v.slice(last,st))); var mk=document.createElement('mark'); mk.className='me-mk'; mk.textContent=word; out.appendChild(mk); last=st+word.length; any=true; }
      if(!any) return; out.appendChild(document.createTextNode(v.slice(last))); t.parentNode.replaceChild(out,t);
    });
  });
}

/* ── render all ── */
var P=null;
function render(keepScroll){
  if(!TABS.some(function(t){ return t.id===state.tab; })) state.tab='rundown';
  var y=window.scrollY;
  if(!DATA){ renderNav(); $('#main').innerHTML='<p class="empty">Loading the rundown…</p>'; return; }
  P=parse(); renderNav(); renderTop(P);
  if(state.tab==='info') renderInfo(P);
  else if(state.tab==='songs') renderSongs();
  else if(state.tab==='seating') renderSeating();
  else if(state.tab==='materials') renderMaterials();
  else if(state.tab==='me') renderMe(P);
  else if(state.tab==='sheet') renderSheet();
  else renderRundown(P);
  if(keepScroll) window.scrollTo(0,y);
}

/* ── modals ── */
function openModal(html){ $('#modal').innerHTML=html; $('#back').hidden=false; }
function closeModal(){ $('#back').hidden=true; state.editing=null; }
var toastT;
function toast(msg,err){ var t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'+(err?' err':''); },2600); }

function colName(c){ var s=''; while(c>0){ var m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function openEditor(si,r,c){
  var m=model(si), old=m.get(r,c);
  var label = (P && si===P.si && P.hdr && r>P.hdr) ? ({}[c]||'') : '';
  if(P && si===P.si && P.labels){ var L={}; L[P.cols.t]=P.labels.t; L[P.cols.w]=P.labels.w; L[P.cols.d]=P.labels.d; L[P.cols.e]=P.labels.e; if(r>P.hdr) label=L[c]||''; }
  state.editing={si:si,r:r,c:c,old:old};
  openModal('<div class="mh"><b>'+esc(label||'Edit cell')+'</b><span>'+esc(DATA.sheets[si].name)+' · '+colName(c)+r+'</span></div>'+
    '<textarea id="edText" spellcheck="false">'+esc(old)+'</textarea>'+
    '<div class="ma"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="save">Save</button></div>');
  var ta=$('#edText'); setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },50);
}
function applyLocal(si,r,c,v){
  var sh=DATA.sheets[si]; while(sh.display.length<r) sh.display.push([]);
  var row=sh.display[r-1]; while(row.length<c) row.push(''); row[c-1]=v;
}
function save(){
  var e=state.editing; if(!e) return;
  var nv=$('#edText').value;
  if(nv===e.old){ closeModal(); return; }
  var btn=document.querySelector('[data-act="save"]'); btn.disabled=true; btn.textContent='Saving…';
  if(!LIVE){ applyLocal(e.si,e.r,e.c,nv); closeModal(); render(true); toast('Changed on this device only'); return; }
  apiPost('saveCell', {sheetId:DATA.sheets[e.si].id,row:e.r,col:e.c,oldValue:e.old,newValue:nv,pin:state.pin}, function(res){
    if(res && res.ok){ DATA=res.data; cacheSet(DATA); state.lastSync=new Date(); state.online=true; closeModal(); render(true); toast('Saved for everyone ✓'); }
    else if(res && res.error==='conflict'){ DATA=res.data; closeModal(); render(true); toast('Someone just changed this. Showing their version.',true); }
    else if(res && res.error==='pin'){ state.pin=''; ss('rd_pin',''); closeModal(); state.edit=false; render(true); toast('Edit PIN needed',true); }
    else { btn.disabled=false; btn.textContent='Save'; toast('Could not save, please try again',true); }
  }, function(){ btn.disabled=false; btn.textContent='Save'; toast('No connection. Not saved yet.',true); });
}
function askPin(){
  openModal('<div class="mh"><b>Enter edit PIN</b></div><p>Ask the couple or Winsy for the PIN.</p><input id="pinIn" type="password" inputmode="numeric" autocomplete="off">'+
    '<div class="ma"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="pin">Unlock</button></div>');
  setTimeout(function(){ $('#pinIn').focus(); },50);
}
function submitPin(){
  var v=$('#pinIn').value;
  apiPost('checkPin', {pin:v}, function(ok){
    if(ok){ state.pin=v; ss('rd_pin',v); closeModal(); if(state.afterPin){ var af=state.afterPin; state.afterPin=null; af(); return; } state.edit=true; render(true); toast('Editing on'); }
    else toast('Wrong PIN',true);
  }, function(){ toast('No connection',true); });
}

/* ── events ── */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var act=t.closest('[data-act]');
  if(act){ var a=act.getAttribute('data-act'); if(a==='cancel') closeModal(); else if(a==='save') save(); else if(a==='pin') submitPin(); else if(a==='st') pickStatus(act.getAttribute('data-v')); return; }
  if(t.id==='back'){ closeModal(); return; }
  var lg=t.closest('[data-lang]'); if(lg){ setLang(lg.getAttribute('data-lang')); return; }
  if(t.closest('#themeBtn')){
    var nt=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', nt); try{ localStorage.setItem('rd_theme', nt); }catch(e){}
    render(true); return;
  }
  if(t.closest('#editBtn')){
    if(GUEST) return;
    if(state.edit){ state.edit=false; render(true); return; }
    if(LIVE && DATA && DATA.pinRequired && !state.pin){ askPin(); return; }
    state.edit=true; render(true); return;
  }
  var tab=t.closest('[data-tab]');
  if(tab){ state.tab=tab.getAttribute('data-tab'); ss('rd_tab',state.tab); render(); window.scrollTo(0,0); return; }
  var mep=t.closest('[data-me]'); if(mep){ meId(mep.getAttribute('data-me')); state.meq=''; render(); window.scrollTo(0,0); return; }
  if(t.closest('[data-mechange]')){ meId(''); state.meq=''; render(); window.scrollTo(0,0); return; }
  var msf=t.closest('[data-seatme]'); if(msf){ state.sq=msf.getAttribute('data-seatme'); state.tab='seating'; ss('rd_tab','seating'); render(); window.scrollTo(0,0); return; }
  var sht=t.closest('[data-sheet]'); if(sht){ state.sheet=+sht.getAttribute('data-sheet'); render(); return; }
  var mtb=t.closest('[data-mtf],[data-mtpic],[data-mtview],[data-st],[data-mtwho]');
  if(mtb){
    state.mt=state.mt||{view:'date',pic:'',f:'',q:''};
    if(mtb.hasAttribute('data-st')){ openStatus(+mtb.getAttribute('data-st')); return; }
    if(mtb.hasAttribute('data-mtf')){ var mf=mtb.getAttribute('data-mtf'); state.mt.f=state.mt.f===mf?'':mf; }
    if(mtb.hasAttribute('data-mtpic')){ var mp=mtb.getAttribute('data-mtpic'); state.mt.pic=state.mt.pic===mp?'':mp; }
    if(mtb.hasAttribute('data-mtview')) state.mt.view=mtb.getAttribute('data-mtview');
    if(mtb.hasAttribute('data-mtwho')) state.mt.who=!state.mt.who;
    render(true); return;
  }
  if(state.edit){
    var cell=t.closest('[data-cell]');
    if(cell){ ev.preventDefault(); var p=cell.getAttribute('data-cell').split(':').map(Number); openEditor(p[0],p[1],p[2]); return; }
  }
  var j=t.closest('[data-jump]');
  if(j){ var id=j.getAttribute('data-jump'); var el=id&&document.getElementById(id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); if(el.classList.contains('blk')){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } } }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='meq'){ state.meq=ev.target.value; var mpk=$('#me-pick'); if(mpk) mpk.innerHTML=mePickHtml(mePeople()); return; }
  if(ev.target.id==='mq'){ state.mt=state.mt||{view:'date',pic:'',f:'',q:''}; state.mt.q=ev.target.value; var ml=$('#mt-list'), md=matData(); if(ml && md) ml.innerHTML=matListHtml(md); return; }
  if(ev.target.id==='sq'){ state.sq=ev.target.value; var sw=$('#st-wrap'), ssi=seatSheetIndex(); if(sw && ssi>=0) sw.innerHTML=seatTablesHtml(ssi, parseSeating(ssi)); return; }
  if(ev.target.id==='q'){ state.q=ev.target.value; if(P) $('#list').innerHTML=listHtml(P); var g=document.querySelector('.gcard'); if(g) g.style.display=state.q.trim()?'none':''; }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape' && !$('#back').hidden) closeModal();
  if(ev.key==='Enter' && ev.target.id==='pinIn') submitPin();
});

/* ── live refresh ── */
function refresh(){
  if(!LIVE) return;
  if(state.syncing && Date.now()-state.syncAt<20000) return;
  state.syncing=true; state.syncAt=Date.now(); renderStatus();
  apiGet(function(d){
    state.syncing=false;
    if(!d || !d.sheets){ state.online=false; renderStatus(); return; }
    state.online=true; state.lastSync=new Date(); cacheSet(d);
    var changed = !DATA || JSON.stringify(d.sheets)!==JSON.stringify(DATA.sheets);
    DATA=d;
    if(changed && !state.editing && document.activeElement && document.activeElement.id!=='q' && document.activeElement.id!=='sq' && document.activeElement.id!=='mq' && document.activeElement.id!=='meq') render(true); else renderStatus();
  }, function(){ state.syncing=false; state.online=false; if(DATA) renderStatus(); else $('#main').innerHTML='<p class="empty">Can’t reach the rundown right now. Check your connection; it will retry automatically.</p>'; });
}
setInterval(function(){ if(!document.hidden && !state.editing) refresh(); },15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
setInterval(function(){ if((state.tab==='rundown'||state.tab==='me') && !state.editing && !(document.activeElement&&/^(q|meq)$/.test(document.activeElement.id))) render(true); },60000);

window.__printAll = function(){
  P=parse(); renderTop(P);
  var keep=state.tab; state.tab='info'; renderInfo(P); var a=$('#main').innerHTML;
  state.tab='rundown'; renderRundown(P); $('#main').innerHTML = a + '<div class="pg"></div>' + $('#main').innerHTML; state.tab=keep;
};

if(!DATA && API){ var c0=cacheGet(); if(c0 && c0.d){ DATA=c0.d; state.lastSync=new Date(c0.t); state.online=false; } }
render();
if(API && !HAS_GAS) refresh();
})();
</script>
