<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Rundown</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rundown">
<meta name="theme-color" content="#f7f3ed">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%236a2c8c%22/%3E%3Ctext x=%2232%22 y=%2243%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22Georgia%22%3EA%26K%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ed; --surface:#fffdf9; --surface-2:#f1ebe3; --ink:#2a2130; --muted:#776c80; --faint:#a89eb0;
  --line:#e6dde2; --accent:#6a2c8c; --accent-2:#8b4fb0; --accent-ink:#fff; --accent-soft:#f0e6f6;
  --gold:#a5803e; --alert:#c0392b; --alert-soft:#fdeceb; --music:#2f5d9a; --music-soft:#e9f0fa;
  --note:#6d5a2a; --note-soft:#f8f1dd; --ok:#2e7d4f;
  --shadow:0 1px 2px rgba(42,33,48,.05),0 6px 18px rgba(42,33,48,.06);
  --r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans HK","Microsoft JhengHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Cormorant Garamond","Noto Serif HK","Songti TC",Georgia,serif;
  --tint-mix:38%;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141017; --surface:#1e1823; --surface-2:#271f2d; --ink:#f2edf5; --muted:#a99fb1; --faint:#7b7083;
    --line:#342a3b; --accent:#c8a0e6; --accent-2:#d9bcef; --accent-ink:#1b1220; --accent-soft:#2d2137;
    --gold:#d6b071; --alert:#ff8a7a; --alert-soft:#3a1e1d; --music:#9cbcf0; --music-soft:#1d2738;
    --note:#e3cf98; --note-soft:#2e2818; --ok:#7fd3a2;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    --tint-mix:14%; --hl-mix:9%; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141017; --surface:#1e1823; --surface-2:#271f2d; --ink:#f2edf5; --muted:#a99fb1; --faint:#7b7083;
  --line:#342a3b; --accent:#c8a0e6; --accent-2:#d9bcef; --accent-ink:#1b1220; --accent-soft:#2d2137;
  --gold:#d6b071; --alert:#ff8a7a; --alert-soft:#3a1e1d; --music:#9cbcf0; --music-soft:#1d2738;
  --note:#e3cf98; --note-soft:#2e2818; --ok:#7fd3a2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  --tint-mix:14%; --hl-mix:9%; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
a{color:inherit}

/* ── top bar ── */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:600 19px/1.1 var(--serif);letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.pill.off i{background:var(--faint);box-shadow:none}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;min-height:36px}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}

.editbar{display:none;max-width:760px;margin:0 auto;padding:8px 16px 10px;font-size:13px;color:var(--accent);gap:8px;align-items:center;flex-wrap:wrap}
body.editing .editbar{display:flex}
.editbar a{font-weight:600}

main{max-width:760px;margin:0 auto;padding:14px 16px 24px}

/* ── hero ── */
.hero{position:relative;border-radius:20px;padding:22px 20px 18px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(150deg,var(--accent-soft),var(--surface) 70%);border:1px solid var(--line)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
  border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);box-shadow:0 0 0 14px color-mix(in srgb,var(--gold) 8%,transparent)}
.eyebrow{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{font:600 34px/1.05 var(--serif);margin:6px 0 4px;color:var(--accent)}
.hero .ver{display:inline-block;font-size:12px;font-weight:700;margin-top:4px}
.hero .meta{margin-top:12px;display:grid;gap:4px;font-size:14px}
.hero .meta div{display:flex;gap:8px}
.hero .meta span{color:var(--muted);min-width:64px}
.count{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.count b{font:700 40px/1 var(--serif);color:var(--accent)}
.count span{color:var(--muted);font-size:14px}

/* now card */
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.nowcard h4{margin:0 0 2px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.nowcard .row{display:flex;gap:10px;padding:6px 0;border-top:1px dashed var(--line)}
.nowcard h4+.row{border-top:0}
.nowcard .tm{font-weight:700;min-width:84px;font-variant-numeric:tabular-nums}
.nowcard .nx{color:var(--muted)}
.nowcard .act{display:flex;gap:8px;margin-top:10px}

/* gantt */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
.card-h h3{margin:0;font:600 18px/1.2 var(--serif)}
.card-h small{color:var(--muted);font-size:12px}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 0 12px}
.gantt{position:relative;margin:0 16px}
.gt{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.gt span{position:absolute;top:0;left:4px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gb{position:absolute;height:24px;border-radius:7px;border:1px solid color-mix(in srgb,var(--tint,var(--accent)) 55%,var(--line));
  background:color-mix(in srgb,var(--tint,var(--accent-soft)) 70%,var(--surface));padding:0 6px;font-size:11px;line-height:22px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;cursor:pointer;color:var(--ink)}
:root[data-theme="dark"] .gb{color:#1d1622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb.tinted{color:#1d1622}}
.gb.plain{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.gb.now{outline:2px solid var(--accent);outline-offset:1px}
.gnow{position:absolute;top:14px;bottom:0;width:2px;background:var(--alert);border-radius:2px}
.gnow:before{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--alert)}

/* search + jump */
.tools{display:flex;gap:8px;margin:0 0 10px;position:sticky;top:57px;z-index:20;padding:8px 0;background:var(--bg)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:42px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%;padding:10px 0;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* sections + timeline */
.sec{margin-top:8px}
.sec-h{position:sticky;top:115px;z-index:10;margin:14px -16px 8px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:700 20px/1.2 var(--serif);color:var(--accent);display:flex;align-items:center;gap:10px}
.sec-h:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec-h.hl{background:color-mix(in srgb,#fff200 var(--hl-mix,30%),var(--bg))}
.tl{list-style:none;margin:0;padding:0}
.blk{display:grid;grid-template-columns:62px 18px 1fr;gap:0 6px;position:relative;scroll-margin-top:170px}
.blk.untimed{grid-template-columns:0 18px 1fr}
.blk .t{padding-top:12px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
.blk .t b{display:block;font-size:16px;font-weight:700}
.blk .t em{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-word}
.rail{position:relative}
.rail:before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.blk:first-child .rail:before{top:16px}
.blk:last-child .rail:before{bottom:calc(100% - 20px)}
.dot{position:absolute;left:3px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent-2)}
.cards{padding:6px 0 8px;min-width:0}
.ent{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:11px 14px 12px;margin-bottom:8px;
  border-left:5px solid var(--tint,var(--line));position:relative}
.ent.tinted{background:color-mix(in srgb,var(--tint) var(--tint-mix),var(--surface))}
.who{margin:0 0 3px;font-size:15.5px;font-weight:700;line-height:1.35;white-space:pre-wrap;word-break:break-word}
.desc{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.sub{border-top:1px dashed color-mix(in srgb,var(--muted) 35%,transparent);margin-top:9px;padding-top:9px}
.rem{margin-top:9px;padding:8px 10px;border-radius:10px;background:var(--note-soft);color:var(--note);font-size:13.5px;white-space:pre-wrap;word-break:break-word;display:flex;gap:8px}
.rem svg{flex:none;width:15px;height:15px;margin-top:2px}
.rem.music{background:var(--music-soft);color:var(--music)}
.rem.alert{background:var(--alert-soft);color:var(--alert);font-weight:700}
.badge{position:absolute;top:-9px;right:10px;font-size:10.5px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:999px}
.blk.now .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.blk.now .ent{border-color:color-mix(in srgb,var(--accent) 60%,var(--line));border-left-color:var(--tint,var(--accent))}
.blk.now .ent:first-child .badge{background:var(--accent);color:var(--accent-ink)}
.blk.next .ent:first-child .badge{background:var(--gold);color:#fff}
.blk.past{opacity:.55}
.blk.past .dot{background:var(--line);border-color:var(--faint)}
.blk.flash .ent{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:var(--shadow)}}
mark{background:color-mix(in srgb,#ffd84d 70%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.red{color:var(--alert);font-weight:700}

/* phone links */
.tel{color:var(--accent);font-weight:700;text-decoration:none;border-bottom:1px dashed color-mix(in srgb,var(--accent) 50%,transparent)}
.wa{display:inline-flex;vertical-align:-3px;margin:0 3px 0 4px;width:19px;height:19px;border-radius:50%;background:#25d366;color:#fff;align-items:center;justify-content:center}
.wa svg{width:12px;height:12px}

/* info tab */
.info-title{font:600 30px/1.1 var(--serif);color:var(--accent);margin:4px 0 2px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:11px 16px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted);font-size:13px;padding-top:1px}
.kv .v{white-space:pre-wrap;word-break:break-word;font-weight:600}
.grp{padding:12px 16px 4px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700;border-top:1px solid var(--line)}
.callrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:-2px}
.callbtn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;text-decoration:none;
  background:var(--accent-soft);color:var(--accent)}
.callbtn svg{width:14px;height:14px}
.callbtn.w{background:color-mix(in srgb,#25d366 16%,var(--surface));color:color-mix(in srgb,#128c4b 85%,var(--ink))}

/* seating tab */
.st-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.st-top small{color:var(--muted);font-size:12.5px}
.st-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.st-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px 6px}
.st-h h3{margin:0;font:600 20px/1.2 var(--serif);color:var(--accent)}
.st-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.st-svg{display:block;width:100%;max-width:360px;margin:0 auto;height:auto}
.st-svg .tbl{fill:var(--tt,var(--accent-soft));stroke:var(--gold);stroke-width:1.5}
.st-svg .tname{fill:var(--ink);font:600 15px var(--serif)}
.st-svg .tcount{fill:var(--muted);font:500 10.5px var(--sans)}
.st-svg .seat{fill:var(--surface);stroke:var(--tt-line,var(--accent-2));stroke-width:1.5}
.st-svg .sname{fill:var(--ink);font-family:var(--sans);font-weight:600}
.st-svg .snum{fill:var(--muted);font:600 8.5px var(--sans)}
.st-svg g.hit .seat{fill:var(--gold);stroke:var(--gold)}
.st-svg g.hit .sname{fill:#fff}
.st-svg g.dim{opacity:.28}
.st-list{list-style:none;margin:0;padding:6px 12px 12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;counter-reset:seat}
.st-list li{display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-top:1px dashed var(--line);font-weight:600;word-break:break-word}
.st-list li:before{counter-increment:seat;content:counter(seat);min-width:18px;color:var(--muted);font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.st-list li.hit{background:color-mix(in srgb,var(--gold) 22%,transparent);border-radius:8px}
.st-card.nohit{opacity:.45}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-svg .tbl{fill:color-mix(in srgb,var(--tt,var(--accent-soft)) 22%,var(--surface))}}
:root[data-theme="dark"] .st-svg .tbl{fill:color-mix(in srgb,var(--tt,var(--accent-soft)) 22%,var(--surface))}

/* songs tab */
.sg-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.sg-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px 9px;border-bottom:1px solid var(--line);background:linear-gradient(150deg,var(--music-soft),var(--surface) 80%)}
.sg-h h3{margin:0;font:600 19px/1.2 var(--serif);color:var(--music)}
.sg-h small{color:var(--muted);font-size:12px;white-space:nowrap}
.sg-row{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.sg-row:first-child{border-top:0}
.sg-ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--music-soft);color:var(--music);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.sg-ic svg{width:15px;height:15px}
.sg-tx{min-width:0;flex:1;padding-top:4px}
.sg-lb{display:block;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
.sg-nm{font-weight:600;white-space:pre-wrap;word-break:break-word}
.sg-cue .sg-nm{font-size:16px}

/* sheet tab */
.seg{display:flex;gap:6px;margin-bottom:10px}
.tblwrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:calc(100vh - 200px)}
table.grid{border-collapse:collapse;table-layout:fixed;font-size:12.5px;line-height:1.4}
table.grid td,table.grid th{border:1px solid var(--line);padding:5px 7px;vertical-align:top;white-space:pre-wrap;word-break:break-word}
table.grid th{position:sticky;left:0;background:var(--surface-2);color:var(--muted);font-weight:500;font-size:11px;text-align:right;z-index:1}
table.grid td.f{color:#1d1622}
table.grid td.b{font-weight:700}
.note-s{color:var(--muted);font-size:12.5px;margin:0 0 10px}

/* edit affordances */
body.editing [data-cell]{cursor:pointer;border-radius:6px;outline:1.5px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
body.editing [data-cell]:active{background:var(--accent-soft)}
.ph{display:none}
body.editing .ph{display:inline-block;color:var(--accent);font-size:12.5px;font-weight:600;margin:6px 8px 0 0;padding:2px 6px}
body.editing .tel{pointer-events:none}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:760px;margin:0 auto;display:flex}
.nav button{flex:1;min-width:0;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;white-space:nowrap;letter-spacing:-.1px;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--accent);font-weight:700}

/* sheet modal */
.back{position:fixed;inset:0;z-index:60;background:rgba(20,12,24,.42);display:flex;align-items:flex-end;justify-content:center}
.back[hidden]{display:none}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.modal .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.modal .mh b{font-size:15px}
.modal .mh span{font-size:12px;color:var(--muted)}
.modal textarea,.modal input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);padding:10px 12px;outline:0}
.modal textarea{min-height:120px;max-height:55vh;resize:vertical}
.modal textarea:focus,.modal input:focus{border-color:var(--accent)}
.modal .ma{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal p{margin:0 0 10px;color:var(--muted);font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:70;

};

/* ── text helpers ── */
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hl(s){
  var q = state.q.trim(); if(!q) return esc(s);
  var out='', low=s.toLowerCase(), ql=q.toLowerCase(), i=0, j;
  while((j=low.indexOf(ql,i))>=0){ out+=esc(s.slice(i,j))+'<mark>'+esc(s.slice(j,j+q.length))+'</mark>'; i=j+q.length; }
  return out+esc(s.slice(i));
}
var PHONE = /(^|[^\d+])(?:(\+\d{1,3}[ -]?\d{2,4}[ -]?\d{3,4}[ -]?\d{3,4})|([2-9]\d{3}) ?(\d{4}))(?!\d)/g;
function telOf(m){ return m[2] ? m[2].replace(/[^\d]/g,'') : '852'+m[3]+m[4]; }
/* text exactly as in the sheet; HK numbers become tap-to-call (+ WhatsApp) */
function rich(s,noWa){
  s = String(s); var out='', last=0, m; PHONE.lastIndex=0;
  while((m=PHONE.exec(s))){
    var st = m.index + m[1].length, num = telOf(m);
    out += hl(s.slice(last, st));
    out += '<a class="tel" href="tel:+'+num+'">'+hl(s.slice(st, PHONE.lastIndex))+'</a>'+(noWa?'':
           '<a class="wa" href="https://wa.me/'+num+'" target="_blank" rel="noopener" aria-label="WhatsApp '+num+'">'+I.wa+'</a>');
    last = PHONE.lastIndex;
  }
  return out + hl(s.slice(last));
}
function phonesIn(s){ var r=[],m; PHONE.lastIndex=0; while((m=PHONE.exec(s))) r.push(telOf(m)); return r; }
function hex(c){ c=String(c||'').toLowerCase(); if(/^#[0-9a-f]{3}$/.test(c)) c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3]; return /^#[0-9a-f]{6}$/.test(c)?c:''; }
function isWhite(c){ c=hex(c); return !c || c==='#ffffff'; }
function isRed(c){ c=hex(c); if(!c) return false; var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16); return r>190&&g<90&&b<90; }
function isYellow(c){ c=hex(c); if(!c) return false; var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16); return r>220&&g>220&&b<120; }
function cellAttr(si,r,c){ return ' data-cell="'+si+':'+r+':'+c+'"'; }

/* ── sheet model ── */
function model(si){
  var sh = DATA.sheets[si]; if(!sh) return null;
  var D = sh.display||[], R = D.length, C = 0, cov = {}, mAt = {};
  D.forEach(function(row){ if(row.length>C) C=row.length; });
  (sh.merges||[]).forEach(function(m){
    mAt[m[0]+','+m[1]] = m;
    for(var r=m[0]; r<=m[2]; r++) for(var c=m[1]; c<=m[3]; c++) if(r!==m[0]||c!==m[1]) cov[r+','+c]=[m[0],m[1]];
  });
  function at(arr,r,c,d){ return arr && arr[r-1] && arr[r-1][c-1]!=null ? arr[r-1][c-1] : d; }
  return {
    si:si, sh:sh, R:R, C:C,
    get:function(r,c){ return String(at(D,r,c,'')); },
    bg:function(r,c){ return at(sh.bg,r,c,'#ffffff'); },
    fc:function(r,c){ return at(sh.fc,r,c,'#000000'); },
    bold:function(r,c){ return at(sh.bold,r,c,'normal')==='bold'; },
    covered:function(r,c){ return cov[r+','+c]; },
    mergeAt:function(r,c){ return mAt[r+','+c]; }
  };
}

function rundownSheetIndex(){
  for (var i=0;i<DATA.sheets.length;i++){ var m=model(i); if(findHeader(m)) return i; }
  return 0;
}
function findHeader(m){
  for (var r=1;r<=m.R;r++) for (var c=1;c<=m.C;c++) if (m.get(r,c).trim().toLowerCase()==='time') return {r:r,c:c};
  return null;
}
function isTime(s){ return /^\s*\d{1,2}:\d{2}/.test(s); }
function parseRange(s){
  var m = /^\s*(\d{1,2}):(\d{2})(?:\s*[-–~至]\s*(\d{1,2}):(\d{2}))?/.exec(s||'');
  if(!m) return {start:null,end:null,head:'',tail:s};
  return {start:+m[1]*60+ +m[2], end:m[3]!=null?(+m[3]*60+ +m[4]):null, head:m[1]+':'+m[2], tail:s.slice(s.indexOf(m[2])+2)};
}
function parseDate(s){ var m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||''); return m?{y:+m[3],mo:+m[2],d:+m[1]}:null; }
function dayNum(o){ return Math.round(Date.UTC(o.y,o.mo-1,o.d)/864e5); }

function parse(){
  var si = rundownSheetIndex(), m = model(si), h = findHeader(m);
  var P = { si:si, m:m, info:[], sections:[], title:'', subtitle:null };
  if(!h){ return P; }
  var cols=[]; for (var c=h.c;c<=m.C;c++) if(m.get(h.r,c).trim()) cols.push(c);
  var cT=cols[0], cW=cols[1]||cT+1, cD=cols[2]||cT+2, cE=cols[3]||cT+3;
  P.cols={t:cT,w:cW,d:cD,e:cE}; P.hdr=h.r;
  P.labels={t:m.get(h.r,cT),w:m.get(h.r,cW),d:m.get(h.r,cD),e:m.get(h.r,cE)};

  for (var r=1;r<h.r;r++){
    var cells=[];
    for (var c2=1;c2<=m.C;c2++){ if(m.covered(r,c2)) continue; var v=m.get(r,c2); if(v.trim()) cells.push({r:r,c:c2,v:v,red:isRed(m.fc(r,c2))}); }
    if(r===1 && cells.length){ P.title=cells[0]; P.subtitle=cells[1]||null; continue; }
    if(cells.length) P.info.push({r:r,cells:cells});
  }

  var sec=null, blk=null, card=null;
  for (var r2=h.r+1;r2<=m.R;r2++){
    var t=m.get(r2,cT), w=m.get(r2,cW), d=m.get(r2,cD), e=m.get(r2,cE);
    var tCov=!!m.covered(r2,cT), wCov=!!m.covered(r2,cW), eCov=!!m.covered(r2,cE);
    if(!t.trim() && !w.trim() && !d.trim() && !e.trim()) continue;
    if(t.trim() && !isTime(t) && !w.trim() && !d.trim() && !e.trim()){
      sec={title:t,r:r2,c:cT,blocks:[],date:parseDate(t),yellow:isYellow(m.bg(r2,cT))}; P.sections.push(sec); blk=null; continue;
    }
    if(!sec){ sec={title:'',r:0,blocks:[],date:null}; P.sections.push(sec); }
    if(t.trim() && !tCov){
      var pr=parseRange(t);
      blk={time:t,r:r2,start:pr.start,end:pr.end,head:pr.head,tail:pr.tail,cards:[]}; sec.blocks.push(blk); card=null;
    } else if(!blk){ blk={time:'',r:r2,start:null,end:null,cards:[]}; sec.blocks.push(blk); card=null; }
    var tint=null; [cT,cW,cD].forEach(function(cc){ var b=m.bg(r2,cc); if(!tint && !isWhite(b) && !isRed(b) && !isYellow(b)) tint=hex(b); });
    var row={r:r2,who:w,wCov:wCov,desc:d,rem:e,eCov:eCov,remRed:isRed(m.bg(r2,cE))||isRed(m.fc(r2,cE)),tint:tint};
    var startsCard = !wCov && w.trim();
    if(startsCard || !card){ card={rows:[row],tint:tint,title:startsCard?w:''}; blk.cards.push(card); }
    else card.rows.push(row);
  }
  // end times + labels
  P.sections.forEach(function(s){
    var starts = s.blocks.filter(function(b){return b.start!=null;}).map(function(b){return b.start;}).sort(function(a,b){return a-b;});
    s.blocks.forEach(function(b){
      if(b.start==null) return;
      var nx = starts.filter(function(x){return x>b.start;})[0];
      b.endEff = b.end!=null && b.end>b.start ? b.end : (nx!=null ? nx : b.start+30);
      var c0=b.cards[0], r0=c0&&c0.rows[0];
      b.label = (c0&&c0.title) || (r0 && (r0.desc||r0.rem||'').split('\n')[0]) || '';
      b.tint = c0 && c0.tint;
    });
  });
  P.event = P.sections.filter(function(s){return s.date && /event/i.test(s.title);})[0] || P.sections.filter(function(s){return s.date;}).slice(-1)[0] || null;
  return P;
}

/* ── time ── */
function hkNow(){
  if(state.fakeNow) return state.fakeNow;
  try{
    var p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
    var g=function(k){ return +p.filter(function(x){return x.type===k;})[0].value; };
    return {y:g('year'),mo:g('month'),d:g('day'),min:(g('hour')%24)*60+g('minute')};
  }catch(e){ var n=new Date(Date.now()+8*3600e3); return {y:n.getUTCFullYear(),mo:n.getUTCMonth()+1,d:n.getUTCDate(),min:n.getUTCHours()*60+n.getUTCMinutes()}; }
}
function fmtMin(m){ return Math.floor(m/60)+':'+('0'+(m%60)).slice(-2); }
function hkClock(d){
  try{ return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d); }
  catch(e){ var n=new Date(d.getTime()+8*3600e3); return ('0'+n.getUTCHours()).slice(-2)+':'+('0'+n.getUTCMinutes()).slice(-2); }
}
function statusOf(P){
  var now=hkNow(), res={now:now,current:[],next:null,today:null,days:null};
  if(!P.event) return res;
  res.days = dayNum(P.event.date) - dayNum(now);
  P.sections.forEach(function(s){
    if(!s.date) return;
    var dd = dayNum(s.date) - dayNum(now);
    s.blocks.forEach(function(b){
      b.st = '';
      if(dd<0) b.st='past';
      else if(dd===0 && b.start!=null){
        if(now.min>=b.endEff) b.st='past';
        else if(now.min>=b.start) { b.st='now'; res.current.push(b); }
      }
    });
    if(dd===0){
      res.today=s;
      var fut=s.blocks.filter(function(b){return b.start!=null && b.start>now.min;}).sort(function(a,b){return a.start-b.start;});
      if(fut.length){ res.next=fut[0]; fut.forEach(function(b){ if(b.start===fut[0].start) b.st='next'; }); }
    }
  });
  return res;
}

/* ── render: chrome ── */
var TABS=[{id:'rundown',label:'Rundown',icon:'list'},{id:'seating',label:'Seating',icon:'seat'},{id:'info',label:'Info & Contacts',icon:'people'},{id:'songs',label:'Songs',icon:'music'},{id:'sheet',label:'Sheet view',icon:'grid'}];

  var hh=hkClock(state.lastSync)+' HKT';

/* ── render: rundown ── */
function remHtml(row,si,cE){
  if(row.eCov) return '';
  if(!row.rem.trim()) return '<span class="ph"'+cellAttr(si,row.r,cE)+'>+ remark</span>';
  var music=/^\s*BGM/i.test(row.rem), cls=row.remRed?'alert':(music?'music':'');
  return '<div class="rem '+cls+'"'+cellAttr(si,row.r,cE)+'>'+(row.remRed?I.alert:(music?I.music:I.note))+'<div>'+rich(row.rem)+'</div></div>';
}
function rowMatches(row,b){
  var q=state.q.trim().toLowerCase(); if(!q) return true;
  return [row.who,row.desc,row.rem,b.time].join('\n').toLowerCase().indexOf(q)>=0;
}
function blockHtml(P,b){
  var si=P.si, C=P.cols, cards=[];
  b.cards.forEach(function(card){
    var rows=card.rows.filter(function(r){ return rowMatches(r,b); });
    if(!rows.length) return;
    var html='', first=true;
    rows.forEach(function(row){
      var inner='';
      if(row===card.rows[0] && card.title) inner+='<h3 class="who"'+cellAttr(si,row.r,C.w)+'>'+rich(row.who)+'</h3>';
      else if(!row.wCov && !row.who.trim()) inner+='<span class="ph"'+cellAttr(si,row.r,C.w)+'>+ people / action</span>';
      if(row.desc.trim()) inner+='<p class="desc"'+cellAttr(si,row.r,C.d)+'>'+rich(row.desc)+'</p>';
      else inner+='<span class="ph"'+cellAttr(si,row.r,C.d)+'>+ description</span>';
      inner+=remHtml(row,si,C.e);
      html+= first ? inner : '<div class="sub">'+inner+'</div>';
      first=false;
    });
    var tint=card.tint;

function ganttHtml(P,S){
  var s=P.event; if(!s) return '';
  var bl=s.blocks.filter(function(b){return b.start!=null;});
  if(bl.length<3) return '';
  var t0=Math.floor(Math.min.apply(null,bl.map(function(b){return b.start;}))/60)*60;
  var t1=Math.ceil(Math.max.apply(null,bl.map(function(b){return b.endEff;}))/60)*60;
  var PX=2, lanes=[], items=bl.slice().sort(function(a,b){return a.start-b.start || (b.endEff-b.start)-(a.endEff-a.start);});
  items.forEach(function(b){
    var L=-1; for(var i=0;i<lanes.length;i++) if(lanes[i]<=b.start){L=i;break;}
    if(L<0){ L=lanes.length; lanes.push(0); }
    lanes[L]=Math.max(b.endEff,b.start+12); b.lane=L;
  });
  var W=(t1-t0)*PX, H=22+lanes.length*29;
  var h='<div class="card gcard"><div class="card-h"><h3>Day at a glance</h3><small>'+esc(s.title.replace(/^.*?(\d)/,'$1'))+' · tap a bar</small></div>'+
        '<div class="gscroll" id="gscroll"><div class="gantt" style="width:'+W+'px;height:'+H+'px">';
  for(var m=t0;m<=t1;m+=60) h+='<div class="gt" style="left:'+((m-t0)*PX)+'px"><span>'+fmtMin(m)+'</span></div>';
  items.forEach(function(b){
    var w=Math.max((b.endEff-b.start)*PX-2,10);
    h+='<button type="button" class="gb '+(b.tint?'tinted':'plain')+(b.st==='now'?' now':'')+'" data-jump="b-'+b.r+'" title="'+esc(b.time+' '+b.label)+'" style="left:'+((b.start-t0)*PX)+'px;top:'+(20+b.lane*29)+'px;width:'+w+'px'+(b.tint?';--tint:'+b.tint:'')+'">'+esc(b.label)+'</button>';
  });
  if(S.today===s && S.now.min>=t0 && S.now.min<=t1) h+='<div class="gnow" id="gnow" style="left:'+((S.now.min-t0)*PX)+'px"></div>';
  return h+'</div></div></div>';
}

function seatSheetIndex(){ for(var i=0;i<DATA.sheets.length;i++) if(/seat|座位|坐位|枱|檯/i.test(DATA.sheets[i].name)) return i; return -1; }
function parseSeating(si){
  var m=model(si), blocks=[], cur=[], tables=[];
  for(var r=1;r<=m.R;r++){
    var has=false; for(var c=1;c<=m.C;c++) if(!m.covered(r,c) && m.get(r,c).trim()){ has=true; break; }
    if(!has){ if(cur.length){ blocks.push(cur); cur=[]; } continue; }
    cur.push(r);
  }
  if(cur.length) blocks.push(cur);
  blocks.forEach(function(rows){
    for(var c=1;c<=m.C;c++){
      var cells=rows.filter(function(r){ return !m.covered(r,c) && m.get(r,c).trim(); }).map(function(r){ return {r:r,c:c,v:m.get(r,c)}; });
      if(!cells.length) continue;
      var ti=-1; cells.forEach(function(x,i){ if(ti<0 && /table|枱|檯|席|桌/i.test(x.v)) ti=i; });
      tables.push({title: ti>=0?cells[ti]:null, guests: cells.filter(function(x,i){ return i!==ti; })});
    }
  });
  return tables;
}
function seatSvg(t, si, q){
  var n=t.guests.length, W=340, C=W/2, R=n>14?136:128, rT=n>14?70:76;
  var sr=Math.max(14, Math.min(27, Math.PI*R/Math.max(n,1)-3));
  var title=t.title?t.title.v:'', words=title.split(/\s+/), l1=title, l2='';
  if(title.length>12 && words.length>1){ var h=Math.ceil(words.length/2); l1=words.slice(0,h).join(' '); l2=words.slice(h).join(' '); }
  var s='<svg class="st-svg" viewBox="0 0 '+W+' '+W+'" role="img" aria-label="'+esc(title||'Table')+'">';
  s+='<circle class="tbl" cx="'+C+'" cy="'+C+'" r="'+rT+'"/>';
  s+='<text class="tname" x="'+C+'" y="'+(l2?C-6:C+2)+'" text-anchor="middle">'+esc(l1)+'</text>';
  if(l2) s+='<text class="tname" x="'+C+'" y="'+(C+13)+'" text-anchor="middle">'+esc(l2)+'</text>';
  s+='<text class="tcount" x="'+C+'" y="'+(C+(l2?31:22))+'" text-anchor="middle">'+n+' guest'+(n===1?'':'s')+'</text>';
  t.guests.forEach(function(g,i){
    var a=-Math.PI/2+2*Math.PI*i/n, x=C+R*Math.cos(a), y=C+R*Math.sin(a);
    var nm=g.v.trim(), len=0; for(var k=0;k<nm.length;k++) len+= nm.charCodeAt(k)>255?1.9:1;
    var fs=Math.max(8, Math.min(13, (sr*2-6)/Math.max(len,2)*1.75)), shown=nm;
    if(fs<=8 && len>9){ shown=nm.slice(0,6)+'…'; fs=8.5; }
    var hit=q && nm.toLowerCase().indexOf(q)>=0;
    s+='<g class="'+(q?(hit?'hit':'dim'):'')+'"'+cellAttr(si,g.r,g.c)+'><title>'+(i+1)+'. '+esc(nm)+'</title>'+
       '<circle class="seat" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+sr.toFixed(1)+'"/>'+
       '<text class="sname" x="'+x.toFixed(1)+'" y="'+(y+fs*0.36).toFixed(1)+'" text-anchor="middle" font-size="'+fs.toFixed(1)+'">'+esc(shown)+'</text></g>';
  });
  return s+'</svg>';
}
function renderSeating(){

/* ── render all ── */
var P=null;
function render(keepScroll){
  var y=window.scrollY;
  if(!DATA){ renderNav(); $('#main').innerHTML='<p class="empty">Loading the rundown…</p>'; return; }
  P=parse(); renderNav(); renderTop(P);
  if(state.tab==='info') renderInfo(P);
  else if(state.tab==='songs') renderSongs();
  else if(state.tab==='seating') renderSeating();
  else if(state.tab==='sheet') renderSheet();
  else renderRundown(P);
  if(keepScroll) window.scrollTo(0,y);
}

/* ── modals ── */
function openModal(html){ $('#modal').innerHTML=html; $('#back').hidden=false; }
function closeModal(){ $('#back').hidden=true; state.editing=null; }
var toastT;
function toast(msg,err){ var t=$('#toast'); t.textContent=msg; t.className='toast show'+(err?' err':''); clearTimeout(toastT); toastT=setTimeout(function(){ t.className='toast'+(err?' err':''); },2600); }

function colName(c){ var s=''; while(c>0){ var m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26); } return s; }
function openEditor(si,r,c){
  var m=model(si), old=m.get(r,c);
  var label = (P && si===P.si && P.hdr && r>P.hdr) ? ({}[c]||'') : '';
  if(P && si===P.si && P.labels){ var L={}; L[P.cols.t]=P.labels.t; L[P.cols.w]=P.labels.w; L[P.cols.d]=P.labels.d; L[P.cols.e]=P.labels.e; if(r>P.hdr) label=L[c]||''; }
  state.editing={si:si,r:r,c:c,old:old};
  openModal('<div class="mh"><b>'+esc(label||'Edit cell')+'</b><span>'+esc(DATA.sheets[si].name)+' · '+colName(c)+r+'</span></div>'+
    '<textarea id="edText" spellcheck="false">'+esc(old)+'</textarea>'+
    '<div class="ma"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="save">Save</button></div>');
  var ta=$('#edText'); setTimeout(function(){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },50);
}
function applyLocal(si,r,c,v){
  var sh=DATA.sheets[si]; while(sh.display.length<r) sh.display.push([]);
  var row=sh.display[r-1]; while(row.length<c) row.push(''); row[c-1]=v;
}
function save(){
  var e=state.editing; if(!e) return;
  var nv=$('#edText').value;
  if(nv===e.old){ closeModal(); return; }
  var btn=document.querySelector('[data-act="save"]'); btn.disabled=true; btn.textContent='Saving…';
  if(!LIVE){ applyLocal(e.si,e.r,e.c,nv); closeModal(); render(true); toast('Changed on this device only'); return; }
  apiPost('saveCell', {sheetId:DATA.sheets[e.si].id,row:e.r,col:e.c,oldValue:e.old,newValue:nv,pin:state.pin}, function(res){
    if(res && res.ok){ DATA=res.data; cacheSet(DATA); state.lastSync=new Date(); state.online=true; closeModal(); render(true); toast('Saved for everyone ✓'); }
    else if(res && res.error==='conflict'){ DATA=res.data; closeModal(); render(true); toast('Someone just changed this. Showing their version.',true); }
    else if(res && res.error==='pin'){ state.pin=''; ss('rd_pin',''); closeModal(); state.edit=false; render(true); toast('Edit PIN needed',true); }
    else { btn.disabled=false; btn.textContent='Save'; toast('Could not save, please try again',true); }
  }, function(){ btn.disabled=false; btn.textContent='Save'; toast('No connection. Not saved yet.',true); });
}
function askPin(){
  openModal('<div class="mh"><b>Enter edit PIN</b></div><p>Ask the couple or Winsy for the PIN.</p><input id="pinIn" type="password" inputmode="numeric" autocomplete="off">'+
    '<div class="ma"><button type="button" class="btn ghost" data-act="cancel">Cancel</button><button type="button" class="btn primary" data-act="pin">Unlock</button></div>');
  setTimeout(function(){ $('#pinIn').focus(); },50);
}
function submitPin(){
  var v=$('#pinIn').value;
  apiPost('checkPin', {pin:v}, function(ok){
    if(ok){ state.pin=v; ss('rd_pin',v); closeModal(); state.edit=true; render(true); toast('Editing on'); }
    else toast('Wrong PIN',true);
  }, function(){ toast('No connection',true); });
}

/* ── events ── */
document.addEventListener('click',function(ev){
  var t=ev.target;
  var act=t.closest('[data-act]');
  if(act){ var a=act.getAttribute('data-act'); if(a==='cancel') closeModal(); else if(a==='save') save(); else if(a==='pin') submitPin(); return; }
  if(t.id==='back'){ closeModal(); return; }
  if(t.closest('#editBtn')){
    if(state.edit){ state.edit=false; render(true); return; }
    if(LIVE && DATA && DATA.pinRequired && !state.pin){ askPin(); return; }
    state.edit=true; render(true); return;
  }
  var tab=t.closest('[data-tab]');
  if(tab){ state.tab=tab.getAttribute('data-tab'); ss('rd_tab',state.tab); render(); window.scrollTo(0,0); return; }
  var sht=t.closest('[data-sheet]'); if(sht){ state.sheet=+sht.getAttribute('data-sheet'); render(); return; }
  if(state.edit){
    var cell=t.closest('[data-cell]');
    if(cell){ ev.preventDefault(); var p=cell.getAttribute('data-cell').split(':').map(Number); openEditor(p[0],p[1],p[2]); return; }
  }
  var j=t.closest('[data-jump]');
  if(j){ var id=j.getAttribute('data-jump'); var el=id&&document.getElementById(id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); if(el.classList.contains('blk')){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } } }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='sq'){ state.sq=ev.target.value; var sw=$('#st-wrap'), ssi=seatSheetIndex(); if(sw && ssi>=0) sw.innerHTML=seatTablesHtml(ssi, parseSeating(ssi)); return; }
  if(ev.target.id==='q'){ state.q=ev.target.value; if(P) $('#list').innerHTML=listHtml(P); var g=document.querySelector('.gcard'); if(g) g.style.display=state.q.trim()?'none':''; }
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape' && !$('#back').hidden) closeModal();
  if(ev.key==='Enter' && ev.target.id==='pinIn') submitPin();
});

/* ── live refresh ── */
function refresh(){
  if(!LIVE) return;
  apiGet(function(d){
    if(!d || !d.sheets){ state.online=false; renderStatus(); return; }
    state.online=true; state.lastSync=new Date(); cacheSet(d);
    var changed = !DATA || JSON.stringify(d.sheets)!==JSON.stringify(DATA.sheets);
    DATA=d;
    if(changed && !state.editing && document.activeElement && document.activeElement.id!=='q' && document.activeElement.id!=='sq') render(true); else renderStatus();
  }, function(){ state.online=false; if(DATA) renderStatus(); else $('#main').innerHTML='<p class="empty">Can’t reach the rundown right now. Check your connection; it will retry automatically.</p>'; });
}
setInterval(function(){ if(!document.hidden && !state.editing) refresh(); },15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) refresh(); });
setInterval(function(){ if(state.tab==='rundown' && !state.editing && !(document.activeElement&&document.activeElement.id==='q')) render(true); },60000);

window.__printAll = function(){
  P=parse(); renderTop(P);
  var keep=state.tab; state.tab='info'; renderInfo(P); var a=$('#main').innerHTML;
  state.tab='rundown'; renderRundown(P); $('#main').innerHTML = a + '<div class="pg"></div>' + $('#main').innerHTML; state.tab=keep;
};

if(!DATA && API){ var c0=cacheGet(); if(c0 && c0.d){ DATA=c0.d; state.lastSync=new Date(c0.t); state.online=false; } }
render();
if(API && !HAS_GAS) refresh();
})();
</script>
</body>
</html>
